<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="AgentX 的四步构建流水线">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#F8FAFC"/>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
    <text x="40" y="40" font-size="15" font-weight="600" fill="#0F172A">一次真实会话要过四道手，才能变成可回放的负载</text>
    <text x="40" y="64" font-size="11.5" fill="#64748B">每一步都在丢东西：丢掉的是内容，留下的是长度、时序、分支结构和 KV 前缀复用</text>

    <rect x="30" y="96" width="205" height="216" rx="10" fill="#EFF6FF" stroke="#BAE6FD"/>
    <text x="48" y="126" font-size="13" font-weight="600" fill="#0284C7">① 采集</text>
    <text x="48" y="154" font-size="10.5" fill="#475569">用户环境下挂一个</text>
    <text x="48" y="176" font-size="10.5" fill="#475569">opt-in 的 HTTP 代理</text>
    <text x="48" y="204" font-size="10.5" fill="#475569">记请求与响应时刻、</text>
    <text x="48" y="226" font-size="10.5" fill="#475569">in/out token 数、</text>
    <text x="48" y="248" font-size="10.5" fill="#475569">会话 ID 与子代理 ID</text>

    <line x1="239" y1="204" x2="271" y2="204" stroke="#64748B" stroke-width="1.3" marker-end="url(#a1)"/>

    <rect x="275" y="96" width="205" height="216" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="293" y="126" font-size="13" font-weight="600" fill="#6366F1">② 变换</text>
    <text x="293" y="154" font-size="10.5" fill="#475569">prompt、代码、工具</text>
    <text x="293" y="176" font-size="10.5" fill="#475569">参数与结果全部删掉</text>
    <text x="293" y="204" font-size="10.5" fill="#475569">输入变成 64-token</text>
    <text x="293" y="226" font-size="10.5" fill="#475569">块的会话内链式哈希</text>
    <text x="293" y="248" font-size="10.5" fill="#475569">同块 ID 即共享前缀</text>

    <line x1="484" y1="204" x2="516" y2="204" stroke="#64748B" stroke-width="1.3" marker-end="url(#a1)"/>

    <rect x="520" y="96" width="205" height="216" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="538" y="126" font-size="13" font-weight="600" fill="#6366F1">③ 重建</text>
    <text x="538" y="154" font-size="10.5" fill="#475569">AIPerf 往这些块里</text>
    <text x="538" y="176" font-size="10.5" fill="#475569">填确定性合成 token</text>
    <text x="538" y="204" font-size="10.5" fill="#475569">会话重建成一张 DAG</text>
    <text x="538" y="226" font-size="10.5" fill="#475569">主链 + 并行子代理 +</text>
    <text x="538" y="248" font-size="10.5" fill="#475569">不参与汇合的辅助请求</text>

    <line x1="729" y1="204" x2="761" y2="204" stroke="#64748B" stroke-width="1.3" marker-end="url(#a1)"/>

    <rect x="765" y="96" width="205" height="216" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="783" y="126" font-size="13" font-weight="600" fill="#10B981">④ 回放</text>
    <text x="783" y="154" font-size="10.5" fill="#475569">种子在会话 25%~75%</text>
    <text x="783" y="176" font-size="10.5" fill="#475569">处取一个稳态起点</text>
    <text x="783" y="204" font-size="10.5" fill="#475569">primer 加 10 条预热</text>
    <text x="783" y="226" font-size="10.5" fill="#475569">之后测满 1 小时</text>
    <text x="783" y="248" font-size="10.5" fill="#475569">每次回收换一个标记</text>

    <rect x="30" y="330" width="940" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="48" y="352" font-size="11" fill="#334155">v1.0 语料：393 条会话 · 135,282 个请求 · 每个请求中位 142,016 输入 / 444 输出 token · 44% 的会话带子代理</text>
    <text x="48" y="369" font-size="10" fill="#94A3B8">合成载荷只保留长度与前缀结构，重建后与原始 token 数的中位比值为 1.004</text>
  </g>
</svg>
