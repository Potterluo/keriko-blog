<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="ClawPerf agent 模式的工具循环">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#F8FAFC"/>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
    <text x="40" y="40" font-size="15" font-weight="600" fill="#0F172A">ClawPerf 的 agent 模式：模型真的读写文件、真的跑 shell</text>
    <text x="40" y="64" font-size="11.5" fill="#64748B">循环的出口只有两个，模型自己回一段纯文本，或者撞上步数上限</text>

    <rect x="330" y="86" width="340" height="50" rx="9" fill="#EFF6FF" stroke="#BAE6FD"/>
    <text x="348" y="108" font-size="11.5" fill="#0369A1">任务：一句 prompt 加一份预置工作区</text>
    <text x="348" y="126" font-size="10.5" fill="#64748B">每个任务实例一个干净目录，并发之间不共享文件</text>

    <line x1="500" y1="136" x2="500" y2="170" stroke="#64748B" stroke-width="1.3" marker-end="url(#c1)"/>

    <rect x="330" y="176" width="340" height="56" rx="9" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="348" y="198" font-size="11.5" fill="#4338CA">组装 messages：system、任务、历史、工具结果</text>
    <text x="348" y="218" font-size="10.5" fill="#64748B">带上 4 个工具的函数声明，每轮都会重新发一遍</text>

    <line x1="500" y1="232" x2="500" y2="266" stroke="#64748B" stroke-width="1.3" marker-end="url(#c1)"/>

    <rect x="330" y="272" width="340" height="56" rx="9" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="348" y="294" font-size="11.5" fill="#4338CA">流式 complete：记 TTFT、E2E、usage</text>
    <text x="348" y="314" font-size="10.5" fill="#64748B">tool_calls 的参数分片跨 chunk 累积</text>

    <line x1="500" y1="328" x2="500" y2="340" stroke="#64748B" stroke-width="1.3" marker-end="url(#c1)"/>

    <polygon points="395,376 500,340 605,376 500,412" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="500" y="381" font-size="11" fill="#B45309" text-anchor="middle">这一轮有 tool_calls？</text>

    <line x1="393" y1="376" x2="286" y2="376" stroke="#0284C7" stroke-width="1.3" marker-end="url(#c1)"/>
    <text x="404" y="366" font-size="10.5" fill="#0284C7">是</text>

    <rect x="70" y="326" width="210" height="112" rx="9" fill="#F0F9FF" stroke="#7DD3FC"/>
    <text x="86" y="348" font-size="11.5" fill="#0369A1">执行工具</text>
    <text x="86" y="371" font-size="10.5" fill="#475569">list_files　read_file</text>
    <text x="86" y="392" font-size="10.5" fill="#475569">write_file　run_shell</text>
    <text x="86" y="415" font-size="10.5" fill="#475569">结果截到 4000 字符</text>
    <text x="86" y="432" font-size="10" fill="#94A3B8">shell 超时可配，默认 30s</text>

    <path d="M175,326 L175,204 L324,204" stroke="#64748B" stroke-width="1.3" fill="none" marker-end="url(#c1)"/>
    <text x="64" y="252" font-size="10.5" fill="#64748B">结果以 role=tool</text>
    <text x="64" y="268" font-size="10.5" fill="#64748B">回填进历史</text>

    <line x1="607" y1="376" x2="724" y2="376" stroke="#10B981" stroke-width="1.3" marker-end="url(#c1)"/>
    <text x="618" y="366" font-size="10.5" fill="#10B981">否</text>

    <rect x="730" y="336" width="220" height="88" rx="9" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="746" y="358" font-size="11.5" fill="#047857">一个任务结束</text>
    <text x="746" y="380" font-size="10.5" fill="#475569">记 steps、wall、in/out token</text>
    <text x="746" y="400" font-size="10.5" fill="#475569">再去领下一个任务</text>
    <text x="746" y="416" font-size="10" fill="#94A3B8">完成率就是这条路的比例</text>

    <text x="730" y="196" font-size="10.5" fill="#64748B">每一轮都单独记</text>
    <text x="730" y="214" font-size="10.5" fill="#64748B">TTFT、工具耗时、</text>
    <text x="730" y="232" font-size="10.5" fill="#64748B">输入输出 token 数</text>
    <text x="730" y="258" font-size="10" fill="#94A3B8">thinking token 从</text>
    <text x="730" y="273" font-size="10" fill="#94A3B8">reasoning_content 取</text>

    <rect x="30" y="456" width="940" height="44" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="48" y="482" font-size="11" fill="#B45309">判定「完成」只看这一轮有没有 tool_call：模型被 max_tokens 截断时，同样会被记成完成</text>
  </g>
</svg>
