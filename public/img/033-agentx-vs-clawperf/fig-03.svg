<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="ClawPerf 七个模式的负载来源与两个出口">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#F8FAFC"/>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
    <text x="40" y="40" font-size="15" font-weight="600" fill="#0F172A">七个模式不是七个工具，是四种负载来源加两条出口</text>
    <text x="40" y="64" font-size="11.5" fill="#64748B">左边决定喂什么进去，中间决定要不要真的打到服务端，右边是各自能给出的东西</text>

    <rect x="40" y="96" width="240" height="80" rx="9" fill="#EFF6FF" stroke="#BAE6FD"/>
    <text x="56" y="120" font-size="12" font-weight="600" fill="#0369A1">① 自己造</text>
    <text x="56" y="140" font-size="10" fill="#475569">scenario 多轮，到窗口就压缩</text>
    <text x="56" y="156" font-size="10" fill="#475569">hitrate 比目标与实测命中率</text>
    <text x="56" y="172" font-size="10" fill="#475569">slo 爬坡找满足约束的最大并发</text>

    <rect x="40" y="188" width="240" height="68" rx="9" fill="#EFF6FF" stroke="#BAE6FD"/>
    <text x="56" y="212" font-size="12" font-weight="600" fill="#0369A1">② 录自己的</text>
    <text x="56" y="232" font-size="10" fill="#475569">record 代理把往返写成 JSONL</text>
    <text x="56" y="248" font-size="10" fill="#475569">replay 回放时选 live 或 verbatim</text>

    <rect x="40" y="268" width="240" height="68" rx="9" fill="#EEF2FF" stroke="#A5B4FC"/>
    <text x="56" y="292" font-size="12" font-weight="600" fill="#4338CA">③ 官方语料 AgentX</text>
    <text x="56" y="312" font-size="10" fill="#475569">WEKA trace，393 条生产会话</text>
    <text x="56" y="328" font-size="10" fill="#475569">语料要核验，scenario 全锁死</text>

    <rect x="40" y="348" width="240" height="68" rx="9" fill="#EFF6FF" stroke="#BAE6FD"/>
    <text x="56" y="372" font-size="12" font-weight="600" fill="#0369A1">④ 别人的 trace</text>
    <text x="56" y="392" font-size="10" fill="#475569">trace 吃 kvcache.ai 块哈希 JSONL</text>
    <text x="56" y="408" font-size="10" fill="#475569">trace-convert 转外部数据集</text>

    <rect x="360" y="88" width="280" height="244" rx="9" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="376" y="112" font-size="12" font-weight="600" fill="#047857">真发请求</text>
    <text x="376" y="134" font-size="10" fill="#475569">产出 TTFT、TPOT、吞吐、</text>
    <text x="376" y="150" font-size="10" fill="#475569">实测命中率</text>
    <text x="376" y="174" font-size="10" fill="#475569">再套报告阈值给结论</text>
    <line x1="376" y1="190" x2="624" y2="190" stroke="#A7F3D0"/>
    <text x="376" y="212" font-size="10" fill="#047857">AgentX 在这一格里多要三样</text>
    <text x="376" y="232" font-size="10" fill="#475569">语料身份可核验</text>
    <text x="376" y="250" font-size="10" fill="#475569">scenario 参数锁住</text>
    <text x="376" y="268" font-size="10" fill="#475569">测量窗口满一小时</text>
    <text x="376" y="292" font-size="10" fill="#94A3B8">不合规就拒绝，不静默出数</text>
    <text x="376" y="312" font-size="10" fill="#94A3B8">同样这三条，ClawPerf 留成开关</text>

    <rect x="360" y="356" width="280" height="88" rx="9" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="376" y="380" font-size="12" font-weight="600" fill="#B45309">只跑模拟，不碰端点</text>
    <text x="376" y="402" font-size="10" fill="#475569">块哈希进模拟缓存，算可达复用率</text>
    <text x="376" y="420" font-size="10" fill="#475569">产出命中率上界与预算曲线</text>

    <rect x="700" y="88" width="270" height="244" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="716" y="112" font-size="12" font-weight="600" fill="#334155">报告与判定</text>
    <text x="716" y="136" font-size="10" fill="#475569">分位数、吞吐、命中率差值</text>
    <text x="716" y="156" font-size="10" fill="#475569">阈值判 GOOD / OK / POOR</text>
    <text x="716" y="176" font-size="10" fill="#475569">或一份官方 submission</text>
    <text x="716" y="206" font-size="10" fill="#94A3B8">两边都能出 Markdown 报告，</text>
    <text x="716" y="222" font-size="10" fill="#94A3B8">差别在结论能不能拿去横比</text>

    <rect x="700" y="356" width="270" height="88" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="716" y="380" font-size="12" font-weight="600" fill="#334155">上界与预算</text>
    <text x="716" y="402" font-size="10" fill="#475569">命中率天花板、理想加速比</text>
    <text x="716" y="420" font-size="10" fill="#475569">缓存该给多大的那个拐点</text>

    <line x1="280" y1="136" x2="354" y2="136" stroke="#64748B" stroke-width="1.2" marker-end="url(#m1)"/>
    <line x1="280" y1="222" x2="354" y2="222" stroke="#64748B" stroke-width="1.2" marker-end="url(#m1)"/>
    <line x1="280" y1="302" x2="354" y2="302" stroke="#64748B" stroke-width="1.2" marker-end="url(#m1)"/>
    <line x1="280" y1="382" x2="354" y2="382" stroke="#64748B" stroke-width="1.2" marker-end="url(#m1)"/>

    <line x1="644" y1="210" x2="694" y2="210" stroke="#64748B" stroke-width="1.2" marker-end="url(#m1)"/>
    <line x1="644" y1="400" x2="694" y2="400" stroke="#64748B" stroke-width="1.2" marker-end="url(#m1)"/>

    <line x1="500" y1="352" x2="500" y2="338" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#m2)"/>
    <text x="512" y="348" font-size="9.5" fill="#B45309">同一份 trace 也可以再真回放一次</text>

    <rect x="30" y="470" width="940" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="48" y="492" font-size="11" fill="#334155">同族的是 ②③④：都在把一份已经发生过的东西搬到新机器上，差别在搬的时候留下了什么</text>
    <text x="48" y="510" font-size="10" fill="#94A3B8">① 里的 scenario 是 AgentX 明令禁止的那条；agent 模式不在这张图上，它的负载由模型当场生成</text>
  </g>
</svg>
