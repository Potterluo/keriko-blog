<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
  <rect x="0" y="0" width="1000" height="320" fill="#F8FAFC"/>
  <defs>
    <marker id="t1ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <text x="60" y="44" font-size="15" font-weight="700" fill="#0F172A">三个模型：同一件事的三种描述</text>

  <rect x="60" y="80" width="260" height="90" rx="12" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="190" y="110" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">用户模型</text>
  <text x="190" y="130" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="middle">期望世界</text>
  <text x="190" y="152" font-size="10.5" fill="#B45309" text-anchor="middle">用户认为事情应该是什么样</text>

  <rect x="370" y="80" width="260" height="90" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="500" y="110" font-size="13.5" font-weight="700" fill="#312E81" text-anchor="middle">产品模型</text>
  <text x="500" y="130" font-size="11.5" font-weight="600" fill="#4338CA" text-anchor="middle">设计世界</text>
  <text x="500" y="152" font-size="10.5" fill="#4338CA" text-anchor="middle">我们假设用户需要什么</text>

  <rect x="680" y="80" width="260" height="90" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="810" y="110" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">工程模型</text>
  <text x="810" y="130" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">现实世界</text>
  <text x="810" y="152" font-size="10.5" fill="#047857" text-anchor="middle">系统实际如何运行</text>

  <line x1="322" y1="112" x2="366" y2="112" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#t1ar)"/>
  <line x1="632" y1="112" x2="676" y2="112" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#t1ar)"/>
  <text x="344" y="134" font-size="10" fill="#94A3B8" text-anchor="middle">转译</text>
  <text x="654" y="134" font-size="10" fill="#94A3B8" text-anchor="middle">转译</text>

  <rect x="60" y="206" width="880" height="80" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="76" y="234" font-size="11.5" fill="#475569">产品设计的工作，是让三个模型互相指认：用户口里的词、产品写的验收标准、系统跑出来的数字，能被彼此解释。</text>
  <text x="76" y="258" font-size="11" fill="#94A3B8">三者对不上，就会出现「功能做完了但没人用」，或者「用户说得很清楚、做出来却不是那件事」。</text>
</svg>
