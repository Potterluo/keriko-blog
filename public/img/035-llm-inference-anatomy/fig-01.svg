<svg viewBox="0 0 1000 460" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一条请求穿过 API server、EngineCore 和 GPU worker 三个进程的数据流">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 13px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .title { font-size: 15px; fill: #1e293b; }
  </style>

  <rect x="0" y="0" width="1000" height="460" fill="#F8FAFC"/>

  <text x="500" y="36" text-anchor="middle" class="title">一条请求的数据流：API server → EngineCore → GPU worker</text>

  <!-- 第一行：请求路径，从左到右 -->
  <!-- 1. API server -->
  <rect x="30" y="100" width="190" height="70" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="125" y="124" text-anchor="middle" class="t">HTTP 请求</text>
  <text x="125" y="143" text-anchor="middle" class="t">chat template + tokenizer</text>
  <text x="125" y="161" text-anchor="middle" class="s">prompt_token_ids，长度 P</text>

  <!-- 2. EngineCore: add_request -->
  <rect x="280" y="100" width="190" height="70" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="375" y="124" text-anchor="middle" class="t">add_request</text>
  <text x="375" y="143" text-anchor="middle" class="t">Request 对象入队</text>
  <text x="375" y="161" text-anchor="middle" class="s">block_hashes / 采样参数</text>

  <!-- 3. schedule -->
  <rect x="530" y="100" width="190" height="70" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="625" y="120" text-anchor="middle" class="t">Scheduler.schedule()</text>
  <text x="625" y="139" text-anchor="middle" class="t">SchedulerOutput</text>
  <text x="625" y="158" text-anchor="middle" class="s">{req_id: n_tokens} + 块表</text>

  <!-- 4. KV 分配 -->
  <rect x="780" y="100" width="190" height="70" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="875" y="124" text-anchor="middle" class="t">KVCacheManager</text>
  <text x="875" y="143" text-anchor="middle" class="t">分配 / 复用 / 回收</text>
  <text x="875" y="161" text-anchor="middle" class="s">每请求 block_table</text>

  <!-- 第二行：反向，从右到左 -->
  <rect x="780" y="300" width="190" height="70" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="875" y="324" text-anchor="middle" class="t">ModelRunner</text>
  <text x="875" y="343" text-anchor="middle" class="t">input_ids / slot_mapping</text>
  <text x="875" y="361" text-anchor="middle" class="s">block_tables / seq_lens</text>

  <rect x="530" y="300" width="190" height="70" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="625" y="324" text-anchor="middle" class="t">每层 forward</text>
  <text x="625" y="343" text-anchor="middle" class="t">attention + MLP</text>
  <text x="625" y="361" text-anchor="middle" class="s">TP 组内两次 all-reduce</text>

  <rect x="280" y="300" width="190" height="70" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="375" y="324" text-anchor="middle" class="t">Sampler</text>
  <text x="375" y="343" text-anchor="middle" class="t">每请求 1 个 token</text>
  <text x="375" y="361" text-anchor="middle" class="s">logits [R, V]</text>

  <rect x="30" y="300" width="190" height="70" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="125" y="324" text-anchor="middle" class="t">detokenizer</text>
  <text x="125" y="343" text-anchor="middle" class="t">OutputProcessor → SSE</text>
  <text x="125" y="361" text-anchor="middle" class="s">文本增量回客户端</text>

  <!-- 第一行箭头 -->
  <path d="M225,135 L269,135" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M475,135 L519,135" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M725,135 L769,135" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 换行箭头 -->
  <path d="M875,175 L875,289" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 第二行箭头，从右到左 -->
  <path d="M775,335 L731,335" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M525,335 L481,335" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M275,335 L231,335" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 箭头标签 -->
  <text x="250" y="125" text-anchor="middle" class="s">token</text>
  <text x="500" y="125" text-anchor="middle" class="s">入队</text>
  <text x="750" y="125" text-anchor="middle" class="s">预算</text>
  <text x="892" y="240" text-anchor="middle" class="s">每步增量</text>
  <text x="750" y="325" text-anchor="middle" class="s">张量</text>
  <text x="500" y="325" text-anchor="middle" class="s">hidden</text>
  <text x="250" y="325" text-anchor="middle" class="s">token</text>

  <!-- 进程图例 -->
  <rect x="30" y="412" width="14" height="14" rx="3" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="52" y="424" class="s">API server 进程</text>
  <rect x="280" y="412" width="14" height="14" rx="3" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="302" y="424" class="s">EngineCore 进程</text>
  <rect x="530" y="412" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#10B981"/>
  <text x="552" y="424" class="s">GPU worker 进程（每卡一个）</text>
</svg>
