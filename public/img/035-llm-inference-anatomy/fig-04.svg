<svg viewBox="0 0 1000 560" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KV cache 的三层地址换算与页面大小">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 12px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .title { font-size: 15px; fill: #1e293b; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace; font-size: 12px; fill: #1e293b; }
  </style>

  <rect x="0" y="0" width="1000" height="560" fill="#F8FAFC"/>

  <text x="500" y="36" text-anchor="middle" class="title">KV 的三层地址：token 位置 → 逻辑块 → 物理块</text>

  <!-- 高亮一条 token 的完整路径 -->
  <rect x="338" y="100" width="144" height="330" fill="#FEF3C7" opacity="0.45"/>

  <!-- token 位置条 -->
  <text x="40" y="100" class="s">token 位置 p</text>
  <rect x="40" y="110" width="140" height="40" rx="6" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="110" y="135" text-anchor="middle" class="t">p 0–15</text>
  <rect x="190" y="110" width="140" height="40" rx="6" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="260" y="135" text-anchor="middle" class="t">p 16–31</text>
  <rect x="340" y="110" width="140" height="40" rx="6" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="410" y="135" text-anchor="middle" class="t">p 32–47</text>
  <rect x="490" y="110" width="140" height="40" rx="6" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="560" y="135" text-anchor="middle" class="t">p 48–63</text>

  <!-- p = 37 的标记 -->
  <text x="384" y="92" text-anchor="middle" class="s">p = 37</text>
  <path d="M384,96 L384,104" fill="none" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arrow-orange)"/>

  <!-- 块表 -->
  <rect x="40" y="200" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="110" y="219" text-anchor="middle" class="t">逻辑块 0</text>
  <text x="110" y="237" text-anchor="middle" class="s">物理 2</text>
  <rect x="190" y="200" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="260" y="219" text-anchor="middle" class="t">逻辑块 1</text>
  <text x="260" y="237" text-anchor="middle" class="s">物理 7</text>
  <rect x="340" y="200" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="410" y="219" text-anchor="middle" class="t">逻辑块 2</text>
  <text x="410" y="237" text-anchor="middle" class="s">物理 1</text>
  <rect x="490" y="200" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="560" y="219" text-anchor="middle" class="t">逻辑块 3</text>
  <text x="560" y="237" text-anchor="middle" class="s">物理 9</text>

  <!-- 物理块卡片 -->
  <rect x="40" y="320" width="140" height="104" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="110" y="344" text-anchor="middle" class="t">物理块 2</text>
  <text x="110" y="366" text-anchor="middle" class="s">16 token</text>
  <text x="110" y="386" text-anchor="middle" class="s">含全部 32 层</text>
  <text x="110" y="406" text-anchor="middle" class="s">共 2 MiB</text>

  <rect x="190" y="320" width="140" height="104" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="260" y="344" text-anchor="middle" class="t">物理块 7</text>
  <text x="260" y="366" text-anchor="middle" class="s">16 token</text>
  <text x="260" y="386" text-anchor="middle" class="s">含全部 32 层</text>
  <text x="260" y="406" text-anchor="middle" class="s">共 2 MiB</text>

  <rect x="340" y="320" width="140" height="104" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="410" y="344" text-anchor="middle" class="t">物理块 1</text>
  <text x="410" y="366" text-anchor="middle" class="s">p 32–47 的 KV</text>
  <text x="410" y="386" text-anchor="middle" class="s">p 37 落在偏移 5</text>
  <text x="410" y="406" text-anchor="middle" class="s">共 2 MiB</text>

  <rect x="490" y="320" width="140" height="104" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="560" y="344" text-anchor="middle" class="t">物理块 9</text>
  <text x="560" y="366" text-anchor="middle" class="s">16 token</text>
  <text x="560" y="386" text-anchor="middle" class="s">含全部 32 层</text>
  <text x="560" y="406" text-anchor="middle" class="s">共 2 MiB</text>

  <!-- 表到块的箭头 -->
  <path d="M110,249 L110,309" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M260,249 L260,309" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M410,249 L410,309" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M560,249 L560,309" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 右侧共享说明 -->
  <text x="700" y="212" class="t">前缀共享落在块表上</text>
  <text x="700" y="236" class="s">两个请求的 block_table</text>
  <text x="700" y="254" class="s">指向同一个物理块时，</text>
  <text x="700" y="272" class="s">KV 只存一份，块里带</text>
  <text x="700" y="290" class="s">引用计数，分叉时复制。</text>

  <!-- 底部换算链 -->
  <rect x="40" y="455" width="110" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="95" y="483" text-anchor="middle" class="mono">p = 37</text>
  <rect x="200" y="455" width="180" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="290" y="483" text-anchor="middle" class="mono">i = 37 // 16 = 2</text>
  <rect x="430" y="455" width="230" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="545" y="483" text-anchor="middle" class="mono">phys = table[2] = 1</text>
  <rect x="710" y="455" width="220" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="820" y="483" text-anchor="middle" class="mono">slot = 1×16 + 5 = 21</text>

  <path d="M155,478 L189,478" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M385,478 L419,478" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M665,478 L699,478" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="40" y="534" class="s">page_bytes = 16 token × 32 层 × 2（K/V）× 8 头 × 128 维 × 2 B = 2 MiB（Llama-3.1-8B 口径）</text>
</svg>
