<svg viewBox="0 0 1000 740" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一次前向的形状变化与层内数据流">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 12px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .title { font-size: 15px; fill: #1e293b; }
    .ct { font-size: 11px; fill: #64748b; }
  </style>

  <rect x="0" y="0" width="1000" height="740" fill="#F8FAFC"/>

  <text x="500" y="36" text-anchor="middle" class="title">一次前向的数据形状：T 个 token 摊到 L 层</text>

  <!-- 输入 -->
  <rect x="390" y="90" width="220" height="44" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="500" y="117" text-anchor="middle" class="t">input_ids [T]</text>

  <rect x="390" y="164" width="220" height="48" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="500" y="185" text-anchor="middle" class="t">Embedding</text>
  <text x="500" y="203" text-anchor="middle" class="s">hidden [T, 4096]</text>

  <!-- 层容器 -->
  <rect x="360" y="246" width="280" height="306" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-dasharray="6,4"/>
  <text x="372" y="266" class="ct">第 l 层，循环 L 次</text>

  <rect x="380" y="278" width="240" height="46" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="500" y="297" text-anchor="middle" class="t">QKV 投影 + RoPE</text>
  <text x="500" y="315" text-anchor="middle" class="s">[T, 6144]（GQA）</text>

  <rect x="380" y="348" width="240" height="46" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="500" y="367" text-anchor="middle" class="t">Attention 读写 KV 页</text>
  <text x="500" y="385" text-anchor="middle" class="s">按 block_tables / slot_mapping</text>

  <rect x="380" y="418" width="240" height="46" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="500" y="437" text-anchor="middle" class="t">O 投影 → all-reduce</text>
  <text x="500" y="455" text-anchor="middle" class="s">消息大小 T × 4096 × 2 B</text>

  <rect x="380" y="488" width="240" height="46" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="500" y="507" text-anchor="middle" class="t">MLP 升维再降维</text>
  <text x="500" y="525" text-anchor="middle" class="s">[T, 14336] → all-reduce</text>

  <!-- 输出路径 -->
  <rect x="390" y="586" width="220" height="46" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="500" y="605" text-anchor="middle" class="t">final norm → lm_head</text>
  <text x="500" y="623" text-anchor="middle" class="s">logits [R, 128000]</text>

  <rect x="390" y="666" width="220" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="500" y="693" text-anchor="middle" class="t">Sampler → 下一个 token</text>

  <!-- 竖箭头 -->
  <path d="M500,139 L500,153" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M500,217 L500,235" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M500,324 L500,337" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M500,394 L500,407" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M500,464 L500,477" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M500,557 L500,575" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M500,637 L500,655" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 层循环箭头：从 MLP 出口绕回 QKV 入口 -->
  <path d="M625,500 C 656,500 656,470 656,440 L656,310 C 656,294 648,282 631,282"
        fill="none" stroke="#6366F1" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- 左侧注释 -->
  <text x="30" y="116" class="s">一个 step 只跑一次前向</text>
  <text x="30" y="134" class="s">T 个 token 拼成一批</text>
  <text x="30" y="300" class="s">同一批里可以混有</text>
  <text x="30" y="318" class="s">prefill chunk 与 decode token</text>
  <text x="30" y="500" class="s">hidden 形状在层间不变</text>
  <text x="30" y="620" class="s">prefill 的中间 chunk 不采样</text>

  <!-- 右侧注释 -->
  <text x="700" y="116" class="s">T=6256、H=4096、bf16 时</text>
  <text x="700" y="134" class="s">hidden 约 49 MiB</text>
  <text x="700" y="360" class="s">KV 写入按 slot_mapping</text>
  <text x="700" y="378" class="s">定位物理块与块内偏移</text>
  <text x="700" y="440" class="s">TP=8：每层两次 all-reduce</text>
  <text x="700" y="458" class="s">每次消息 T × 4096 × 2 B</text>
  <text x="700" y="600" class="s">lm_head 只算要出 token 的位置</text>
</svg>
