<svg width="1000" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#F8FAFC"/>
  <defs>
    <marker id="t1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="60" y="40" font-size="15" font-weight="700" fill="#0F172A">训练并行，生成串行</text>

  <text x="60" y="78" font-size="12" font-weight="700" fill="#334155">训练：一次前向，所有位置同时出结果</text>

  <rect x="120" y="96" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="185" y="124" font-size="12" fill="#065F46" text-anchor="middle">y₁</text>
  <rect x="275" y="96" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="340" y="124" font-size="12" fill="#065F46" text-anchor="middle">y₂</text>
  <rect x="430" y="96" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="495" y="124" font-size="12" fill="#065F46" text-anchor="middle">y₃</text>
  <rect x="585" y="96" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="650" y="124" font-size="12" fill="#065F46" text-anchor="middle">y₄</text>
  <rect x="740" y="96" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="805" y="124" font-size="12" fill="#065F46" text-anchor="middle">y₅</text>

  <line x1="185" y1="166" x2="185" y2="144" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <line x1="340" y1="166" x2="340" y2="144" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <line x1="495" y1="166" x2="495" y2="144" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <line x1="650" y1="166" x2="650" y2="144" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <line x1="805" y1="166" x2="805" y2="144" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>

  <rect x="120" y="166" width="130" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="185" y="194" font-size="12" fill="#075985" text-anchor="middle">x₁</text>
  <rect x="275" y="166" width="130" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="340" y="194" font-size="12" fill="#075985" text-anchor="middle">x₂</text>
  <rect x="430" y="166" width="130" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="495" y="194" font-size="12" fill="#075985" text-anchor="middle">x₃</text>
  <rect x="585" y="166" width="130" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="650" y="194" font-size="12" fill="#075985" text-anchor="middle">x₄</text>
  <rect x="740" y="166" width="130" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="805" y="194" font-size="12" fill="#075985" text-anchor="middle">x₅</text>

  <text x="60" y="236" font-size="10.5" fill="#64748B">因果掩码保证位置 i 只看 1..i，五个位置的预测一次算完。</text>

  <line x1="60" y1="262" x2="940" y2="262" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="5 5"/>

  <text x="60" y="298" font-size="12" font-weight="700" fill="#334155">生成：第 i 个词必须等第 i−1 个词选出来</text>

  <rect x="120" y="340" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="185" y="368" font-size="12" fill="#065F46" text-anchor="middle">y₁</text>
  <line x1="252" y1="362" x2="273" y2="362" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <rect x="275" y="340" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="340" y="368" font-size="12" fill="#065F46" text-anchor="middle">y₂</text>
  <line x1="407" y1="362" x2="428" y2="362" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <rect x="430" y="340" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="495" y="368" font-size="12" fill="#065F46" text-anchor="middle">y₃</text>
  <line x1="562" y1="362" x2="583" y2="362" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <rect x="585" y="340" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="650" y="368" font-size="12" fill="#065F46" text-anchor="middle">y₄</text>
  <line x1="717" y1="362" x2="738" y2="362" stroke="#64748B" stroke-width="1.4" marker-end="url(#t1)"/>
  <rect x="740" y="340" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="805" y="368" font-size="12" fill="#065F46" text-anchor="middle">y₅</text>

  <text x="60" y="410" font-size="10.5" fill="#64748B">每个箭头是一次完整前向，m 个词元就要 m 次。Transformer 消掉的是训练的顺序步数，不是生成的。</text>
  <text x="60" y="436" font-size="11" fill="#64748B">所以 2017 年那份「完全并行」的收益，主要落在训练侧；推理的串行一直留到今天，KV 缓存和连续批处理都在补这一段。</text>
</svg>
