  <rect x="140" y="424" width="52" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="166" y="452" font-size="12" fill="#075985" text-anchor="middle">爱</text>
  <rect x="220" y="424" width="52" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="246" y="452" font-size="12" fill="#075985" text-anchor="middle">学</text>
  <rect x="300" y="424" width="52" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="326" y="452" font-size="12" fill="#075985" text-anchor="middle">习</text>

  <text x="60" y="492" font-size="10.5" fill="#64748B">本步权重</text>

  <line x1="358" y1="446" x2="426" y2="446" stroke="#64748B" stroke-width="1.4" marker-end="url(#s1)"/>
  <rect x="430" y="424" width="150" height="44" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="505" y="452" font-size="11.5" font-weight="600" fill="#312E81" text-anchor="middle">cᵢ（第 i 步专属）</text>

  <line x1="582" y1="446" x2="636" y2="446" stroke="#64748B" stroke-width="1.4" marker-end="url(#s1)"/>
  <rect x="640" y="424" width="160" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="720" y="452" font-size="12" fill="#065F46" text-anchor="middle">解码第 i 步</text>

  <text x="640" y="500" font-size="10.5" fill="#64748B">第 i+1 步的权重会重新算一遍，向量也换一个。</text>

  <text x="60" y="548" font-size="11" fill="#64748B">柱子高度就是权重。分数只差 1 和 2，权重已经拉开到 0.09 与 0.58，这是 Softmax 的指数放大。</text>
