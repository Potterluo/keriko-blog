  <rect x="720" y="104" width="60" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="750" y="132" font-size="12" fill="#065F46" text-anchor="middle">love</text>
  <line x1="782" y1="126" x2="796" y2="126" stroke="#64748B" stroke-width="1.4" marker-end="url(#s1)"/>
  <rect x="800" y="104" width="86" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="843" y="132" font-size="12" fill="#065F46" text-anchor="middle">learning</text>

  <text x="640" y="176" font-size="10.5" fill="#64748B">第 1 步和第 10 步拿到的</text>
  <text x="640" y="192" font-size="10.5" fill="#64748B">是同一个向量</text>

  <line x1="60" y1="228" x2="940" y2="228" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="5 5"/>

  <text x="60" y="264" font-size="12" font-weight="700" fill="#334155">Bahdanau 注意力：每一步重新读一遍源句</text>

  <text x="86" y="408" font-size="10" fill="#475569" text-anchor="middle">0.09</text>
  <rect x="66" y="414" width="40" height="8" rx="2" fill="#6366F1"/>
