  <rect x="430" y="104" width="150" height="44" rx="8" fill="#FEF2F2" stroke="#F43F5E" stroke-width="1.8"/>
  <text x="505" y="132" font-size="11.5" font-weight="600" fill="#9F1239" text-anchor="middle">c（固定 8000 维）</text>

  <line x1="582" y1="126" x2="636" y2="126" stroke="#64748B" stroke-width="1.4" marker-end="url(#s1)"/>
