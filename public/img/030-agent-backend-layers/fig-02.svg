<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="领域层的三个对象">
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#F8FAFC"/>

  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">领域层只有三个对象</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">对话、工具、上下文。这三个的定义决定了系统长什么样</text>

  <!-- Session -->
  <rect x="40" y="92" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="60" y="118" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#4338CA">Session</text>
  <text x="60" y="142" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">id：对话编号，之后复用它</text>
  <text x="60" y="164" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">messages：消息列表，会一直增长</text>
  <text x="60" y="186" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">append(message)：往里追加</text>
  <text x="60" y="208" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">对话就是整个系统的表现形态</text>

  <!-- 三种消息 -->
  <line x1="190" y1="220" x2="190" y2="248" stroke="#64748B" stroke-width="1.3" marker-end="url(#e1)"/>
  <text x="200" y="240" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">messages 里是这三种</text>

  <rect x="40" y="252" width="140" height="46" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="110" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#4338CA">UserMessage</text>
  <text x="110" y="289" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#6366F1">只有文本</text>

  <rect x="192" y="252" width="148" height="46" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="266" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#4338CA">AssistantMessage</text>
  <text x="266" y="289" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#6366F1">文本 + 工具调用</text>

  <rect x="40" y="310" width="300" height="46" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="60" y="330" font-family="system-ui,sans-serif" font-size="10.5" fill="#4338CA">ToolResult</text>
  <text x="60" y="347" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#6366F1">tool_call_id + content</text>

  <rect x="40" y="368" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="388" font-family="system-ui,sans-serif" font-size="10.5" fill="#334155">ToolCall</text>
  <text x="60" y="406" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#64748B">挂在 AssistantMessage 上，带 id 和参数</text>

  <!-- 箭头 Session -> Context -->
  <line x1="340" y1="156" x2="404" y2="156" stroke="#64748B" stroke-width="1.3" marker-end="url(#e1)"/>
  <text x="346" y="146" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">组装成</text>

  <!-- Context -->
  <rect x="410" y="92" width="260" height="152" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="430" y="118" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0369A1">Context&lt;OpType&gt;</text>
  <text x="430" y="142" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">instruction：这次要做什么</text>
  <text x="430" y="164" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">tools：能用哪些工具</text>
  <text x="430" y="186" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">history：此前发生了什么</text>
  <text x="430" y="208" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">output_type：要模型回什么</text>
  <text x="430" y="230" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">泛型是为了同一套机制服务两个角色</text>

  <!-- Tool -->
  <rect x="710" y="92" width="250" height="152" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="730" y="118" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#047857">Tool</text>
  <text x="730" y="142" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">name：模型靠它点名</text>
  <text x="730" y="164" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">description：干什么用</text>
  <text x="730" y="186" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">parameters：要传什么</text>
  <text x="730" y="208" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">invoke(args)：真正执行</text>
  <text x="730" y="230" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">前三个给模型看，最后一个给人跑</text>

  <line x1="670" y1="168" x2="706" y2="168" stroke="#64748B" stroke-width="1.3" marker-end="url(#e1)"/>
  <text x="662" y="158" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">引用</text>

  <!-- 底部说明 -->
  <rect x="40" y="292" width="920" height="0" fill="none"/>
  <text x="410" y="290" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">两个角色（回复用户、审核工具调用）产出的都是 Context，只是 output_type 不同</text>
</svg>
