<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#F8FAFC"/>
  <defs>
    <marker id="f4ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="15" font-weight="700" fill="#0F172A">EUBVR：一次学习活动的闭环</text>

  <text x="686" y="128" font-size="11" font-weight="700" fill="#F43F5E" text-anchor="middle">命门</text>

  <rect x="40" y="140" width="152" height="76" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="116" y="172" font-size="13" font-weight="700" fill="#312E81" text-anchor="middle">Explore</text>
  <text x="116" y="193" font-size="11.5" fill="#4338CA" text-anchor="middle">探索问题</text>

  <rect x="230" y="140" width="152" height="76" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/>
  <text x="306" y="172" font-size="13" font-weight="700" fill="#075985" text-anchor="middle">Understand</text>
  <text x="306" y="193" font-size="11.5" fill="#0369A1" text-anchor="middle">建立理解</text>

  <rect x="420" y="140" width="152" height="76" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="496" y="172" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Build</text>
  <text x="496" y="193" font-size="11.5" fill="#047857" text-anchor="middle">动手实践</text>

  <rect x="610" y="140" width="152" height="76" rx="10" fill="#FEF2F2" stroke="#F43F5E" stroke-width="2.4"/>
  <text x="686" y="172" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">Verify</text>
  <text x="686" y="193" font-size="11.5" fill="#BE123C" text-anchor="middle">独立验证</text>

  <rect x="800" y="140" width="152" height="76" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="876" y="172" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Reflect</text>
  <text x="876" y="193" font-size="11.5" fill="#B45309" text-anchor="middle">复盘沉淀</text>

  <line x1="194" y1="178" x2="226" y2="178" stroke="#64748B" stroke-width="1.6" marker-end="url(#f4ar)"/>
  <line x1="384" y1="178" x2="416" y2="178" stroke="#64748B" stroke-width="1.6" marker-end="url(#f4ar)"/>
  <line x1="574" y1="178" x2="606" y2="178" stroke="#64748B" stroke-width="1.6" marker-end="url(#f4ar)"/>
  <line x1="764" y1="178" x2="796" y2="178" stroke="#64748B" stroke-width="1.6" marker-end="url(#f4ar)"/>

  <path d="M 876 216 L 876 300 L 116 300 L 116 222" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#f4ar)"/>
  <text x="496" y="326" font-size="11" fill="#64748B" text-anchor="middle">Reflect 的结果写回 Learner 层，下一轮从「你已经会的」开始</text>

  <text x="40" y="372" font-size="12" font-weight="700" fill="#9F1239">Verify 为什么会造假</text>

  <rect x="40" y="388" width="290" height="88" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="60" y="416" font-size="12" font-weight="700" fill="#9F1239">Agent 出题，Agent 判分</text>
  <text x="60" y="440" font-size="11" fill="#64748B">流程看着完整，其实是自己</text>
  <text x="60" y="458" font-size="11" fill="#64748B">给自己盖章</text>

  <rect x="355" y="388" width="290" height="88" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="375" y="416" font-size="12" font-weight="700" fill="#9F1239">代码跑通 = 掌握</text>
  <text x="375" y="440" font-size="11" fill="#64748B">机器对了，不证明人懂了</text>
  <text x="375" y="458" font-size="11" fill="#64748B">改一行参数解释不了，就是没懂</text>

  <rect x="670" y="388" width="290" height="88" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="690" y="416" font-size="12" font-weight="700" fill="#9F1239">顺畅 = 会了</text>
  <text x="690" y="440" font-size="11" fill="#64748B">流畅掩盖理解的真空</text>
  <text x="690" y="458" font-size="11" fill="#64748B">越顺手越该警惕</text>
</svg>
