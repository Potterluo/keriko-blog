<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 713" width="640" height="713">
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="320" y="37" font-size="16" fill="#1e293b" text-anchor="middle">从 etcd 崩溃到最初的报错：控制平面雪崩因果链</text>

  <!-- 箭头层：每条连接线从上一层的状态指向它造成的后果 -->
  <path d="M320,119 L 320,131" stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#arrow-pink)"/>
  <path d="M320,201 L 320,213" stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#arrow-pink)"/>
  <path d="M320,283 L 320,295" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M320,365 L 320,377" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M320,447 L 320,459" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M320,529 L 320,541" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M320,611 L 320,623" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- 受害链条：1-2 触发源层 -->
  <rect x="60" y="60" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="320" y="82" font-size="12" fill="#9d174d" text-anchor="middle">etcd 反复退出，陷入崩溃重启循环</text>
  <text x="320" y="100" font-size="10" fill="#64748b" text-anchor="middle">退出码 8 → 9，新容器只活了 20 秒</text>

  <rect x="60" y="142" width="520" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="320" y="164" font-size="12" fill="#9d174d" text-anchor="middle">kube-apiserver 启动即退出</text>
  <text x="320" y="182" font-size="10" fill="#64748b" text-anchor="middle">依赖 etcd，退出码 9</text>

  <!-- 受害链条：3-5 连锁反应层 -->
  <rect x="60" y="224" width="520" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="246" font-size="12" fill="#b45309" text-anchor="middle">controller-manager / scheduler / calico 全部失控</text>
  <text x="320" y="264" font-size="10" fill="#64748b" text-anchor="middle">重启次数 98→99、36→37、22 次</text>

  <rect x="60" y="306" width="520" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="328" font-size="12" fill="#b45309" text-anchor="middle">三台 master 的 6443 全部无进程监听</text>
  <text x="320" y="346" font-size="10" fill="#64748b" text-anchor="middle">refused · refused · no route to host</text>

  <rect x="60" y="388" width="520" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="410" font-size="12" fill="#b45309" text-anchor="middle">HAProxy 后端池为空</text>
  <text x="320" y="428" font-size="10" fill="#64748b" text-anchor="middle">tcp-check 全部失败，日志 &lt;NOSRV&gt; / SC</text>

  <!-- 受害链条：6-7 客户端表现层 -->
  <rect x="60" y="470" width="520" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="492" font-size="12" fill="#1e40af" text-anchor="middle">经 VIP 的请求被立即断开</text>
  <text x="320" y="510" font-size="10" fill="#64748b" text-anchor="middle">所有经 141.111.32.128:8443 的 API 请求都返回 EOF</text>

  <rect x="60" y="552" width="520" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="574" font-size="12" fill="#1e40af" text-anchor="middle">kubelet 无法上报，节点 NotReady</text>
  <text x="320" y="592" font-size="10" fill="#64748b" text-anchor="middle">每次 ListAndWatch 要 36 秒才超时 EOF</text>

  <!-- 受害链条：8 我们最先看到的症状 -->
  <rect x="60" y="634" width="520" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="656" font-size="12" fill="#166534" text-anchor="middle">我们最先看到的症状：面板查询 CPU 历史失败</text>
  <text x="320" y="674" font-size="10" fill="#64748b" text-anchor="middle">Failed to get resource usage history: ... EOF</text>
</svg>
