<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 713" width="880" height="713">
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <text x="440" y="37" font-size="16" fill="#1e293b" text-anchor="middle">从一次误操作到全集群瘫痪：控制平面故障因果链</text>

  <!-- 背景层：二次故障分组框（虚线容器） -->
  <rect x="520" y="190" width="320" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="530" y="204" font-size="11" fill="#64748b">推波助澜的二次故障</text>

  <!-- 连接线层：主链（自顶向下单向传染） -->
  <path d="M250,119 L 250,131" stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#arrow-pink)"/>
  <path d="M250,201 L 250,213" stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#arrow-pink)"/>
  <path d="M250,283 L 250,295" stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#arrow-pink)"/>
  <path d="M250,365 L 250,377" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M250,447 L 250,459" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M250,529 L 250,541" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M250,611 L 250,623" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- 连接线层：二次故障从分组框指回后果区（跨层回路，画在方框之上） -->
  <path d="M520,365 C 490,365 491,579 471,579" stroke="#a855f7" stroke-width="1.5"
        stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- 主链：1 触发源 -->
  <rect x="40" y="60" width="420" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="250" y="82" font-size="12" fill="#9d174d" text-anchor="middle">master-1 物理失联，主机层不可达</text>
  <text x="250" y="100" font-size="10" fill="#64748b" text-anchor="middle">No route to host，3 节点只剩 2 个可用</text>

  <rect x="40" y="142" width="420" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="250" y="164" font-size="12" fill="#9d174d" text-anchor="middle">master-3 的 etcd 数据目录被污染</text>
  <text x="250" y="182" font-size="10" fill="#64748b" text-anchor="middle">排查中误用 --force-new-cluster 启动新集群</text>

  <!-- 主链：2 根因 -->
  <rect x="40" y="224" width="420" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="250" y="246" font-size="12" fill="#9d174d" text-anchor="middle">etcd 集群丢失 Quorum</text>
  <text x="250" y="264" font-size="10" fill="#64748b" text-anchor="middle">只剩 master-2 一个健康节点，无法形成多数派</text>

  <!-- 主链：3 连锁反应 -->
  <rect x="40" y="306" width="420" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="328" font-size="12" fill="#b45309" text-anchor="middle">etcd 崩溃重启循环，apiserver 起不来</text>
  <text x="250" y="346" font-size="10" fill="#64748b" text-anchor="middle">etcd 退出码 8 → 9，apiserver 退出码 9</text>

  <rect x="40" y="388" width="420" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="410" font-size="12" fill="#b45309" text-anchor="middle">三台 master 的 6443 全部无进程监听</text>
  <text x="250" y="428" font-size="10" fill="#64748b" text-anchor="middle">refused · refused · no route to host</text>

  <rect x="40" y="470" width="420" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="492" font-size="12" fill="#b45309" text-anchor="middle">HAProxy 后端池为空</text>
  <text x="250" y="510" font-size="10" fill="#64748b" text-anchor="middle">tcp-check 全失败，日志 &lt;NOSRV&gt; / SC</text>

  <!-- 主链：4 客户端表现 -->
  <rect x="40" y="552" width="420" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="574" font-size="12" fill="#1e40af" text-anchor="middle">经 VIP 的所有 API 请求返回 EOF</text>
  <text x="250" y="592" font-size="10" fill="#64748b" text-anchor="middle">kubectl 挂起，kubelet 每次上报超时 36 秒</text>

  <rect x="40" y="634" width="420" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="250" y="656" font-size="12" fill="#166534" text-anchor="middle">我们最先看到的症状：面板查询失败</text>
  <text x="250" y="674" font-size="10" fill="#64748b" text-anchor="middle">Failed to get resource usage history: ... EOF</text>

  <!-- 二次故障：放大后果的分支 -->
  <rect x="540" y="220" width="280" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="680" y="242" font-size="12" fill="#6b21a8" text-anchor="middle">Keepalived VIP 漂移到 master-3</text>
  <text x="680" y="260" font-size="10" fill="#64748b" text-anchor="middle">而 master-3 的 apiserver 已经挂了</text>

  <rect x="540" y="302" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="680" y="324" font-size="12" fill="#9d174d" text-anchor="middle">kubelet 断连，容器被终止</text>
  <text x="680" y="342" font-size="10" fill="#64748b" text-anchor="middle">Pod 状态未同步，出现幽灵 Pod</text>

  <rect x="540" y="384" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="680" y="406" font-size="12" fill="#9d174d" text-anchor="middle">Harbor 因 Redis 幽灵返回 502</text>
  <text x="680" y="424" font-size="10" fill="#64748b" text-anchor="middle">Redis master 容器已不存在</text>

  <rect x="540" y="466" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="680" y="488" font-size="12" fill="#9d174d" text-anchor="middle">镜像拉取全部失败</text>
  <text x="680" y="506" font-size="10" fill="#64748b" text-anchor="middle">依赖镜像的 Pod 陷入 ImagePullBackOff</text>
</svg>
