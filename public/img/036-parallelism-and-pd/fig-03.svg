<svg viewBox="0 0 1000 520" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="P2D KV 传输的三种落点">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 12px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .k { font-size: 11px; fill: #1e293b; }
    .title { font-size: 15px; fill: #1e293b; }
  </style>

  <rect x="0" y="0" width="1000" height="520" fill="#F8FAFC"/>
  <text x="500" y="36" text-anchor="middle" class="title">KV 从 P 池到 D 池的三种落点</text>

  <!-- 卡片 1 -->
  <rect x="40" y="70" width="290" height="360" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="98" class="t">同节点：NVLink / CUDA IPC</text>
  <rect x="70" y="130" width="100" height="54" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="120" y="162" text-anchor="middle" class="k">P GPU</text>
  <rect x="200" y="130" width="100" height="54" rx="8" fill="#D1FAE5" stroke="#10B981"/>
  <text x="250" y="162" text-anchor="middle" class="k">D GPU</text>
  <path d="M175,157 L189,157" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="146" text-anchor="middle" class="s">KV</text>
  <text x="56" y="220" class="s">带宽：数百 GB/s，走 NVLink 或共享显存</text>
  <text x="56" y="238" class="s">尾延迟可以忽略，适合首 token 路径</text>
  <text x="56" y="256" class="s">代价：P/D 抢同一台机器的显存与网卡</text>
  <text x="56" y="300" class="s">典型：NIXL 同机、SGLang 的 NVLink 内存池</text>
  <text x="56" y="318" class="s">扩容粒度粗，一台机器就是一个实例</text>

  <!-- 卡片 2 -->
  <rect x="355" y="70" width="290" height="360" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="371" y="98" class="t">跨节点：GPUDirect RDMA</text>
  <rect x="375" y="120" width="110" height="96" rx="8" fill="#F1F5F9" stroke="#94a3b8" stroke-dasharray="5,3"/>
  <text x="430" y="140" text-anchor="middle" class="s">节点 A</text>
  <rect x="390" y="150" width="80" height="34" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="430" y="171" text-anchor="middle" class="k">GPU</text>
  <rect x="390" y="196" width="80" height="14" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="430" y="207" text-anchor="middle" class="s">NIC</text>
  <rect x="515" y="120" width="110" height="96" rx="8" fill="#F1F5F9" stroke="#94a3b8" stroke-dasharray="5,3"/>
  <text x="570" y="140" text-anchor="middle" class="s">节点 B</text>
  <rect x="530" y="150" width="80" height="34" rx="5" fill="#D1FAE5" stroke="#10B981"/>
  <text x="570" y="171" text-anchor="middle" class="k">GPU</text>
  <rect x="530" y="196" width="80" height="14" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="570" y="207" text-anchor="middle" class="s">NIC</text>
  <path d="M489,168 L511,168" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="160" text-anchor="middle" class="s">IB</text>
  <text x="371" y="244" class="s">带宽：单卡 400 Gbps，约 50 GB/s</text>
  <text x="371" y="262" class="s">KV 块注册成可 RDMA 的内存，按层写</text>
  <text x="371" y="280" class="s">主力形态，受链路带宽与网卡数约束</text>
  <text x="371" y="324" class="s">典型：NIXL/UCX、Mooncake</text>
  <text x="371" y="342" class="s">没有 GPUDirect 时多一次主机内存拷贝</text>

  <!-- 卡片 3 -->
  <rect x="670" y="70" width="290" height="360" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="686" y="98" class="t">中转：KV store / 分层缓存</text>
  <rect x="690" y="128" width="80" height="44" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="730" y="155" text-anchor="middle" class="k">P GPU</text>
  <rect x="800" y="112" width="146" height="110" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="873" y="138" text-anchor="middle" class="k">KV 池</text>
  <text x="873" y="158" text-anchor="middle" class="s">DRAM + SSD</text>
  <text x="873" y="178" text-anchor="middle" class="s">按前缀寻址</text>
  <text x="873" y="198" text-anchor="middle" class="s">跨请求复用</text>
  <path d="M775,150 L789,150" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="782" y="140" text-anchor="middle" class="s">写</text>
  <rect x="690" y="252" width="80" height="44" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="730" y="279" text-anchor="middle" class="k">D GPU</text>
  <path d="M873,227 C 873,258 820,274 781,274" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="836" y="250" text-anchor="middle" class="s">读</text>
  <text x="686" y="330" class="s">延迟：毫秒到几十毫秒，不适合首 token</text>
  <text x="686" y="348" class="s">价值：前缀命中时免去 P 池重算</text>
  <text x="686" y="366" class="s">典型：Mooncake、LMCache、FlexKV</text>
  <text x="686" y="410" class="s">适合缓存路径与弹性调度，不适合直连</text>

  <text x="40" y="466" class="s">选择顺序：P/D 同机优先 NVLink，其次 GPUDirect RDMA，KV 池只放在缓存路径上</text>
  <text x="40" y="488" class="s">三种落点的差别是带宽、延迟与扩容粒度：越靠近显存越快，越靠近存储越灵活</text>
</svg>
