<svg viewBox="0 0 1000 680" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="对称与非对称 PD 部署的并行布局和 KV 传输路径">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 12px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .g { font-size: 10px; fill: #1e293b; }
    .title { font-size: 15px; fill: #1e293b; }
    .sub { font-size: 13px; fill: #1e293b; }
  </style>

  <rect x="0" y="0" width="1000" height="680" fill="#F8FAFC"/>
  <text x="500" y="36" text-anchor="middle" class="title">对称与非对称：并行布局决定 KV 怎么传</text>

  <!-- ============ 上：对称 ============ -->
  <text x="60" y="76" class="sub">对称：两侧同一套并行布局</text>

  <rect x="60" y="96" width="340" height="210" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-dasharray="6,4"/>
  <text x="76" y="118" class="t">P 池：TP8</text>
  <rect x="76" y="130" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="112" y="158" text-anchor="middle" class="g">GPU 0</text>
  <rect x="158" y="130" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="194" y="158" text-anchor="middle" class="g">GPU 1</text>
  <rect x="240" y="130" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="276" y="158" text-anchor="middle" class="g">GPU 2</text>
  <rect x="322" y="130" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="353" y="158" text-anchor="middle" class="g">GPU 3</text>
  <rect x="76" y="190" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="112" y="218" text-anchor="middle" class="g">GPU 4</text>
  <rect x="158" y="190" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="194" y="218" text-anchor="middle" class="g">GPU 5</text>
  <rect x="240" y="190" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="276" y="218" text-anchor="middle" class="g">GPU 6</text>
  <rect x="322" y="190" width="72" height="48" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="353" y="218" text-anchor="middle" class="g">GPU 7</text>
  <text x="76" y="272" class="s">每卡 1/8 head 切片，块内地址一致</text>
  <text x="76" y="290" class="s">扩容只能两侧同构按比例加</text>

  <rect x="600" y="96" width="340" height="210" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-dasharray="6,4"/>
  <text x="616" y="118" class="t">D 池：TP8</text>
  <rect x="616" y="130" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="652" y="158" text-anchor="middle" class="g">GPU 0</text>
  <rect x="698" y="130" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="734" y="158" text-anchor="middle" class="g">GPU 1</text>
  <rect x="780" y="130" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="816" y="158" text-anchor="middle" class="g">GPU 2</text>
  <rect x="862" y="130" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="893" y="158" text-anchor="middle" class="g">GPU 3</text>
  <rect x="616" y="190" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="652" y="218" text-anchor="middle" class="g">GPU 4</text>
  <rect x="698" y="190" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="734" y="218" text-anchor="middle" class="g">GPU 5</text>
  <rect x="780" y="190" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="816" y="218" text-anchor="middle" class="g">GPU 6</text>
  <rect x="862" y="190" width="72" height="48" rx="6" fill="#D1FAE5" stroke="#10B981"/>
  <text x="893" y="218" text-anchor="middle" class="g">GPU 7</text>
  <text x="616" y="272" class="s">每卡 1/8 head 切片，和 P 侧一一对应</text>
  <text x="616" y="290" class="s">KV 直接写进同号 rank 的块</text>

  <path d="M405,201 L589,201" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="497" y="190" text-anchor="middle" class="s">KV 逐层 P2P，分片一一对应</text>
  <text x="497" y="220" text-anchor="middle" class="s">无需重排，尾延迟只受带宽影响</text>

  <!-- ============ 下：非对称 ============ -->
  <text x="60" y="350" class="sub">非对称：两侧各自选最优布局</text>

  <rect x="60" y="366" width="300" height="244" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-dasharray="6,4"/>
  <text x="76" y="388" class="t">P 池：TP8 或 EP32</text>
  <rect x="76" y="400" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="106" y="425" text-anchor="middle" class="g">0</text>
  <rect x="144" y="400" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="174" y="425" text-anchor="middle" class="g">1</text>
  <rect x="212" y="400" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="242" y="425" text-anchor="middle" class="g">2</text>
  <rect x="280" y="400" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="310" y="425" text-anchor="middle" class="g">3</text>
  <rect x="76" y="450" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="106" y="475" text-anchor="middle" class="g">4</text>
  <rect x="144" y="450" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="174" y="475" text-anchor="middle" class="g">5</text>
  <rect x="212" y="450" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="242" y="475" text-anchor="middle" class="g">6</text>
  <rect x="280" y="450" width="60" height="40" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="310" y="475" text-anchor="middle" class="g">7</text>
  <text x="76" y="522" class="s">大 batch prefill，chunk 调度</text>
  <text x="76" y="540" class="s">目标函数是 TTFT，算力优先</text>
  <text x="76" y="558" class="s">可以用更低的显存/卡型号</text>

  <!-- staging buffer -->
  <rect x="392" y="420" width="186" height="96" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="485" y="444" text-anchor="middle" class="t">GPU staging buffer</text>
  <text x="485" y="464" text-anchor="middle" class="s">聚合 head 切片成连续缓冲</text>
  <text x="485" y="482" text-anchor="middle" class="s">整块 RDMA，再散回目标页</text>
  <text x="485" y="500" text-anchor="middle" class="s">异构 TP 下快 2–5 倍</text>

  <path d="M365,438 L381,438" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M583,438 L597,438" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <rect x="610" y="366" width="330" height="244" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-dasharray="6,4"/>
  <text x="626" y="388" class="t">D 池：TP16 + DCP8</text>
  <rect x="626" y="400" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="680" y="400" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="734" y="400" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="788" y="400" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="626" y="430" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="680" y="430" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="734" y="430" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="788" y="430" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="626" y="460" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="680" y="460" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="734" y="460" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="788" y="460" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="626" y="490" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="680" y="490" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="734" y="490" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="788" y="490" width="46" height="24" rx="4" fill="#D1FAE5" stroke="#10B981"/>
  <text x="626" y="548" class="s">16 卡：KV 复制倍数从 8× 降到 1×</text>
  <text x="626" y="568" class="s">目标函数是 TPOT 与并发，显存优先</text>
  <text x="626" y="588" class="s">可以与 P 池异构，按比例独立扩缩</text>

  <text x="60" y="646" class="s">代价：多一次重排、staging 池占显存；两边布局解耦，收益是各自按瓶颈扩容，不必同构</text>
</svg>
