<svg viewBox="0 0 1000 590" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六种并行策略切在张量的哪个维度上">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 12px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .k { font-size: 11px; fill: #1e293b; }
    .title { font-size: 15px; fill: #1e293b; }
  </style>

  <rect x="0" y="0" width="1000" height="590" fill="#F8FAFC"/>
  <text x="500" y="36" text-anchor="middle" class="title">六种切分：切在哪一维，就决定每步搬什么</text>

  <!-- 卡片背景 -->
  <rect x="40" y="70" width="290" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="355" y="70" width="290" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="670" y="70" width="290" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="40" y="320" width="290" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="355" y="320" width="290" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="670" y="320" width="290" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- 1. TP -->
  <text x="56" y="96" class="t">TP：按 hidden / head 切</text>
  <rect x="76" y="116" width="160" height="86" rx="4" fill="#EEF2FF" stroke="#6366F1"/>
  <path d="M116,116 L116,202 M156,116 L156,202 M196,116 L196,202" stroke="#6366F1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="96" y="164" text-anchor="middle" class="s">0</text>
  <text x="136" y="164" text-anchor="middle" class="s">1</text>
  <text x="176" y="164" text-anchor="middle" class="s">2</text>
  <text x="216" y="164" text-anchor="middle" class="s">3</text>
  <text x="246" y="125" class="s">H</text>
  <text x="66" y="162" text-anchor="end" class="s">T</text>
  <text x="56" y="228" class="s">4 个 rank 各拿 1/4 的列，权重分片</text>
  <text x="56" y="246" class="s">每层 2 次 all-reduce，量 ∝ T·H</text>
  <text x="56" y="264" class="s">绑 NVLink，跨机即掉一档</text>

  <!-- 2. DP -->
  <text x="371" y="96" class="t">DP：按请求切</text>
  <rect x="391" y="116" width="150" height="86" rx="4" fill="#EEF2FF" stroke="#6366F1"/>
  <path d="M391,145 L541,145 M391,174 L541,174" stroke="#6366F1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="466" y="136" text-anchor="middle" class="s">请求组 0</text>
  <text x="466" y="165" text-anchor="middle" class="s">请求组 1</text>
  <text x="466" y="194" text-anchor="middle" class="s">请求组 2</text>
  <text x="551" y="125" class="s">H</text>
  <text x="381" y="162" text-anchor="end" class="s">B</text>
  <text x="371" y="228" class="s">每张卡一份完整权重，各跑各的请求</text>
  <text x="371" y="246" class="s">稠密模型每步无集合通信</text>
  <text x="371" y="264" class="s">MoE 时退化成 EP，需对齐同步</text>

  <!-- 3. PP -->
  <text x="686" y="96" class="t">PP：按层切</text>
  <rect x="716" y="112" width="150" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="791" y="127" text-anchor="middle" class="k">层 0–19</text>
  <rect x="716" y="140" width="150" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="791" y="155" text-anchor="middle" class="k">层 20–39</text>
  <rect x="716" y="168" width="150" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="791" y="183" text-anchor="middle" class="k">层 40–59</text>
  <rect x="716" y="196" width="150" height="22" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="791" y="211" text-anchor="middle" class="k">层 60–79</text>
  <path d="M884,116 L884,214" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="686" y="228" class="s">每个 stage 一段层，边界上 P2P 送激活</text>
  <text x="686" y="246" class="s">每加一级多一次串行往返，decode 敏感</text>
  <text x="686" y="264" class="s">跨机放模型的主力，靠 chunk 填流水</text>

  <!-- 4. EP -->
  <text x="56" y="346" class="t">EP：按专家切</text>
  <g>
    <rect x="60" y="372" width="20" height="16" rx="2" fill="#FEF3C7" stroke="#F59E0B"/>
    <rect x="60" y="396" width="20" height="16" rx="2" fill="#FEF3C7" stroke="#F59E0B"/>
    <rect x="60" y="420" width="20" height="16" rx="2" fill="#FEF3C7" stroke="#F59E0B"/>
    <rect x="60" y="444" width="20" height="16" rx="2" fill="#FEF3C7" stroke="#F59E0B"/>
    <rect x="206" y="376" width="84" height="22" rx="4" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="248" y="391" text-anchor="middle" class="k">专家 0</text>
    <rect x="206" y="404" width="84" height="22" rx="4" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="248" y="419" text-anchor="middle" class="k">专家 1</text>
    <rect x="206" y="432" width="84" height="22" rx="4" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="248" y="447" text-anchor="middle" class="k">专家 2</text>
    <path d="M82,380 C 140,380 150,387 196,387" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
    <path d="M82,404 C 140,404 150,415 196,415" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
    <path d="M82,428 C 140,428 150,443 196,443" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  </g>
  <text x="56" y="492" class="s">token 按路由发到持有专家的卡上</text>
  <text x="56" y="510" class="s">dispatch + combine 两次 all-to-all</text>
  <text x="56" y="528" class="s">量 ∝ token 数 × 激活专家数 / EP</text>

  <!-- 5. PCP -->
  <text x="371" y="346" class="t">PCP：按 prompt token 切</text>
  <rect x="391" y="374" width="200" height="34" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
  <path d="M441,374 L441,408 M491,374 L491,408 M541,374 L541,408" stroke="#0284C7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="416" y="396" text-anchor="middle" class="k">C0</text>
  <text x="466" y="396" text-anchor="middle" class="k">C1</text>
  <text x="516" y="396" text-anchor="middle" class="k">C2</text>
  <text x="566" y="396" text-anchor="middle" class="k">C3</text>
  <text x="371" y="470" class="s">长 prompt 切成 4 段，每段一个 CP rank</text>
  <text x="371" y="492" class="s">每层 gather / 环流 KV，补齐因果掩码</text>
  <text x="371" y="510" class="s">量 ∝ prompt 长度 × KV 宽度</text>
  <text x="371" y="528" class="s">换 TTFT，不增卡数也不增显存</text>

  <!-- 6. DCP -->
  <text x="686" y="346" class="t">DCP：按 KV 序列维切</text>
  <rect x="716" y="368" width="200" height="18" rx="3" fill="#D1FAE5" stroke="#10B981"/>
  <text x="816" y="381" text-anchor="middle" class="s">Q（1 token）</text>
  <rect x="716" y="396" width="200" height="34" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
  <path d="M766,396 L766,430 M816,396 L816,430 M866,396 L866,430" stroke="#0284C7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="741" y="418" text-anchor="middle" class="k">KV 0</text>
  <text x="791" y="418" text-anchor="middle" class="k">KV 1</text>
  <text x="841" y="418" text-anchor="middle" class="k">KV 2</text>
  <text x="891" y="418" text-anchor="middle" class="k">KV 3</text>
  <text x="686" y="470" class="s">KV 显存按 D 分之一存，复制倍数下降</text>
  <text x="686" y="492" class="s">每层 Q gather + 输出按 LSE 合并</text>
  <text x="686" y="510" class="s">量 ≈ 一次 all-reduce，换并发上限</text>
  <text x="686" y="528" class="s">MLA 模型只有 1 个 KV 头时收益最大</text>
</svg>
