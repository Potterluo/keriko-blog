<svg viewBox="0 0 1000 450" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="P2D 逐层流水传输的时序">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#10B981"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .t { font-size: 12px; fill: #1e293b; }
    .s { font-size: 10.5px; fill: #64748b; }
    .k { font-size: 11px; fill: #1e293b; }
    .title { font-size: 15px; fill: #1e293b; }
  </style>

  <rect x="0" y="0" width="1000" height="450" fill="#F8FAFC"/>
  <text x="500" y="36" text-anchor="middle" class="title">逐层流水：P 侧算完一层就发一层，D 侧只等最后一层</text>

  <!-- 泳道标签 -->
  <text x="120" y="134" text-anchor="end" class="k">P 池 GPU</text>
  <text x="120" y="200" text-anchor="end" class="k">KV 传输</text>
  <text x="120" y="292" text-anchor="end" class="k">D 池 GPU</text>

  <!-- P 侧计算块 -->
  <rect x="130" y="110" width="140" height="40" rx="5" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="200" y="135" text-anchor="middle" class="k">层 0</text>
  <rect x="270" y="110" width="140" height="40" rx="5" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="340" y="135" text-anchor="middle" class="k">层 1</text>
  <rect x="410" y="110" width="140" height="40" rx="5" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="480" y="135" text-anchor="middle" class="k">层 2</text>
  <rect x="550" y="110" width="140" height="40" rx="5" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="620" y="135" text-anchor="middle" class="k">末层</text>

  <!-- 传输块 -->
  <rect x="270" y="180" width="50" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B"/>
  <rect x="410" y="180" width="50" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B"/>
  <rect x="550" y="180" width="50" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B"/>
  <rect x="690" y="180" width="50" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B"/>

  <!-- 传输与下一层重叠的示意 -->
  <path d="M295,157 L295,175" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="305" y="170" class="s">第 i 层算完立即发，和第 i+1 层计算重叠</text>

  <!-- t_prefill 括号 -->
  <path d="M130,95 L690,95" fill="none" stroke="#6366F1" stroke-width="1.2"/>
  <path d="M130,88 L130,102" stroke="#6366F1" stroke-width="1.2"/>
  <path d="M690,88 L690,102" stroke="#6366F1" stroke-width="1.2"/>
  <text x="410" y="84" text-anchor="middle" class="s">t_prefill：prefill 的计算时间</text>

  <!-- t_tail 括号 -->
  <path d="M690,232 L740,232" fill="none" stroke="#F59E0B" stroke-width="1.2"/>
  <path d="M690,225 L690,239" stroke="#F59E0B" stroke-width="1.2"/>
  <path d="M740,225 L740,239" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="715" y="254" text-anchor="middle" class="s">t_tail</text>

  <!-- D 侧 decode -->
  <rect x="740" y="270" width="55" height="36" rx="5" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="795" y="270" width="55" height="36" rx="5" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="850" y="270" width="55" height="36" rx="5" fill="#D1FAE5" stroke="#10B981"/>
  <text x="767" y="293" text-anchor="middle" class="s">decode</text>
  <text x="822" y="293" text-anchor="middle" class="s">decode</text>
  <text x="877" y="293" text-anchor="middle" class="s">decode</text>

  <!-- 首 token 标记 -->
  <path d="M795,262 L795,270" stroke="#10B981" stroke-width="1.4"/>
  <text x="838" y="258" text-anchor="middle" class="s">首 token 在这里产生</text>

  <!-- 时间轴 -->
  <path d="M130,330 L930,330" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="940" y="334" class="s">时间</text>

  <!-- TTFT 括号 -->
  <path d="M130,355 L795,355" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M130,348 L130,362" stroke="#64748b" stroke-width="1.2"/>
  <path d="M795,348 L795,362" stroke="#64748b" stroke-width="1.2"/>
  <text x="462" y="380" text-anchor="middle" class="s">TTFT = 排队 + t_prefill + t_tail + 首个 decode step</text>

  <text x="40" y="422" class="s">带宽不足时 t_tail 会盖过计算；带宽充足时传输几乎完全藏在 prefill 里</text>
</svg>
