<svg viewBox="0 0 1000 712" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="定稿分层中 Router 只含路由与请求两个领域，缓存判断在进程外的 UCM Connector">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#10B981"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .title { font-size: 15px; fill: #1e293b; }
    .layer { font-size: 12px; font-weight: 700; fill: #334155; }
    .box { font-size: 11.5px; fill: #1e293b; font-weight: 600; }
    .s { font-size: 10px; fill: #64748b; }
    .edge { font-size: 11px; font-weight: 700; fill: #9F1239; }
  </style>

  <rect x="0" y="0" width="1000" height="712" fill="#F8FAFC"/>
  <text x="500" y="30" text-anchor="middle" class="title">v4 定稿：Router 进程内只有路由和请求，缓存知识在进程边界之外</text>

  <!-- Router 进程边界 -->
  <rect x="60" y="46" width="880" height="536" rx="14" fill="none" stroke="#F43F5E" stroke-dasharray="7,5" stroke-width="1.4"/>
  <text x="76" y="66" class="edge">Router 进程边界</text>

  <!-- Inbound -->
  <rect x="240" y="80" width="160" height="44" rx="10" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="320" y="99" text-anchor="middle" class="box" fill="#1E40AF">OpenAI HTTP</text>
  <text x="320" y="115" text-anchor="middle" class="s">协议解析与流透传</text>
  <rect x="420" y="80" width="130" height="44" rx="10" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="485" y="99" text-anchor="middle" class="box" fill="#475569">Admin</text>
  <text x="485" y="115" text-anchor="middle" class="s">节点管理</text>
  <rect x="570" y="80" width="130" height="44" rx="10" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="635" y="99" text-anchor="middle" class="box" fill="#475569">Health / Metrics</text>

  <!-- Application -->
  <rect x="100" y="148" width="800" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="118" y="170" class="layer">Application · 编排</text>
  <rect x="140" y="182" width="280" height="44" rx="10" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="280" y="201" text-anchor="middle" class="box" fill="#1E40AF">RouteRequest</text>
  <text x="280" y="217" text-anchor="middle" class="s">选 P、选 D，并提两路请求</text>
  <rect x="460" y="182" width="280" height="44" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="600" y="201" text-anchor="middle" class="box" fill="#075985">Request Lifecycle</text>
  <text x="600" y="217" text-anchor="middle" class="s">取消、超时、断连清理</text>

  <path d="M320,124 L320,137 M485,124 L420,137 M635,124 L620,137" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Domain -->
  <rect x="100" y="262" width="800" height="140" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="118" y="284" class="layer">Domain · 仅两域</text>

  <rect x="140" y="296" width="340" height="90" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
  <text x="310" y="318" text-anchor="middle" class="box" fill="#3730A3">Routing</text>
  <text x="310" y="340" text-anchor="middle" class="s">ServingNode · NodePool</text>
  <text x="310" y="358" text-anchor="middle" class="s">RoutingPolicy · RouteAssignment</text>
  <text x="310" y="376" text-anchor="middle" class="s">P / D 独立选择，各持轮询状态</text>

  <rect x="520" y="296" width="340" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="690" y="318" text-anchor="middle" class="box" fill="#075985">Request</text>
  <text x="690" y="340" text-anchor="middle" class="s">RequestContext · RequestState</text>
  <text x="690" y="358" text-anchor="middle" class="s">两路任务的依赖与占用</text>
  <text x="690" y="376" text-anchor="middle" class="s">终止即释放两侧并发计数</text>

  <path d="M300,240 L300,251 M600,240 L600,251" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Ports -->
  <rect x="100" y="424" width="800" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="118" y="446" class="layer">Ports</text>
  <rect x="140" y="456" width="180" height="26" rx="7" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="230" y="473" text-anchor="middle" class="s" fill="#334155">NodeProvider</text>
  <rect x="340" y="456" width="180" height="26" rx="7" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="430" y="473" text-anchor="middle" class="s" fill="#334155">EngineClient</text>
  <rect x="540" y="456" width="180" height="26" rx="7" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="630" y="473" text-anchor="middle" class="s" fill="#334155">SessionRepository</text>
  <text x="820" y="473" text-anchor="middle" class="s" fill="#9F1239">无 PrefetchPort</text>

  <!-- Adapters -->
  <rect x="100" y="510" width="800" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="118" y="532" class="layer">Adapters</text>
  <rect x="140" y="522" width="300" height="36" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="290" y="538" text-anchor="middle" class="s" fill="#065F46">Engine：vLLM / MindIE / SGLang</text>
  <text x="290" y="553" text-anchor="middle" class="s" fill="#065F46">在此把预取决策转成 UCM 请求关键字</text>
  <rect x="460" y="522" width="180" height="36" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="550" y="544" text-anchor="middle" class="s" fill="#475569">Discovery：静态 / K8s</text>
  <rect x="660" y="522" width="200" height="36" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="760" y="544" text-anchor="middle" class="s" fill="#475569">Persistence：内存会话</text>

  <!-- UCM Connector（进程外） -->
  <rect x="100" y="612" width="800" height="70" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="500" y="638" text-anchor="middle" class="box" fill="#065F46">UCM Connector（位于 D 节点，Router 进程之外）</text>
  <text x="500" y="660" text-anchor="middle" class="s" fill="#065F46">哈希命中判断 · SSD → DRAM 提升 · 等待 P 尚未写入的 KV · 就绪后放行 Decode</text>
  <text x="500" y="676" text-anchor="middle" class="s" fill="#065F46">底层为共享文件系统，哈希值即文件名，无 master server</text>

  <!-- 跨边界箭头 -->
  <path d="M290,568 C 290,592 360,596 400,608" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="330" y="596" class="s" fill="#065F46">Decode 请求（含关键字）</text>
</svg>
