<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="注意力的四层包装">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#F8FAFC"/>

  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">注意力：一次加权求和，外面包了四层</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">从下往上看，每一层都在解决同一个问题：不够灵活</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="86" width="920" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="58" y="118" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#334155">① 直接相加</text>
    <text x="58" y="142" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">先解决「有没有」</text>

    <rect x="200" y="104" width="52" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="226" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4338CA">x₁</text>
    <rect x="264" y="104" width="52" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="290" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4338CA">x₂</text>
    <rect x="328" y="104" width="52" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="354" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4338CA">x₃</text>

    <line x1="390" y1="117" x2="436" y2="117" stroke="#64748B" stroke-width="1.3" marker-end="url(#a2)"/>
    <circle cx="466" cy="117" r="16" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="466" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">Σ</text>
    <line x1="486" y1="117" x2="530" y2="117" stroke="#64748B" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="540" y="122" font-family="system-ui,sans-serif" font-size="11" fill="#334155">h = x₁ + x₂ + x₃</text>

    <text x="700" y="114" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">缺口：不同词的重要程度一样</text>
    <text x="700" y="134" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">「的」和「苹果」被同等对待</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="180" width="920" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="58" y="212" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#334155">② 加权求和</text>
    <text x="58" y="236" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">加一个系数</text>

    <rect x="200" y="198" width="60" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="230" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4338CA">w₁x₁</text>
    <rect x="270" y="198" width="60" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="300" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4338CA">w₂x₂</text>
    <rect x="340" y="198" width="60" height="26" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="370" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4338CA">w₃x₃</text>

    <line x1="410" y1="211" x2="446" y2="211" stroke="#64748B" stroke-width="1.3" marker-end="url(#a2)"/>
    <circle cx="466" cy="211" r="16" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <text x="466" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">Σ</text>
    <line x1="486" y1="211" x2="530" y2="211" stroke="#64748B" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="540" y="216" font-family="system-ui,sans-serif" font-size="11" fill="#334155">h = Σ wᵢ xᵢ</text>

    <text x="700" y="208" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">缺口：系数凭什么这么定</text>
    <text x="700" y="228" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">总得有个算得出来的来源</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="40" y="274" width="920" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="58" y="306" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#334155">③ 拆成 Q、K、V</text>
    <text x="58" y="330" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">系数改用点积算</text>

    <rect x="200" y="292" width="76" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="238" y="309" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0369A1">Q = xW_Q</text>
    <rect x="288" y="292" width="76" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="326" y="309" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0369A1">K = xW_K</text>
    <rect x="376" y="292" width="76" height="26" rx="6" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="414" y="309" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0369A1">V = xW_V</text>

    <text x="470" y="309" font-family="system-ui,sans-serif" font-size="11" fill="#334155">w = Q·K，再乘 V 求和</text>

    <text x="700" y="302" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">缺口：直接用词向量算，不自如</text>
    <text x="700" y="322" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">三个矩阵都是可训练的线性层</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="40" y="368" width="920" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="58" y="400" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#334155">④ 多头拼接</text>
    <text x="58" y="424" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">一组不够就多组</text>

    <rect x="200" y="386" width="64" height="26" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="232" y="403" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#047857">头 1</text>
    <rect x="272" y="386" width="64" height="26" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="304" y="403" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#047857">头 2</text>
    <rect x="344" y="386" width="64" height="26" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="376" y="403" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#047857">头 3</text>
    <line x1="414" y1="399" x2="446" y2="399" stroke="#64748B" stroke-width="1.3" marker-end="url(#a2)"/>
    <rect x="452" y="386" width="90" height="26" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="497" y="403" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">concat</text>

    <text x="580" y="403" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#334155">维度仍是 768</text>
    <text x="700" y="396" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">缺口：一组注意力只看一个角度</text>
    <text x="700" y="416" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">多组并行，最后拼回去</text>
  </g>
</svg>
