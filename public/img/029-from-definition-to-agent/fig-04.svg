<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" width="1000" height="442" role="img" aria-label="Transformer 五个零件的替换情况">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1000" height="442" fill="#F8FAFC"/>

  <text x="40" y="42" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">五个零件，五个都被换过了</text>
  <text x="40" y="66" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">原始论文里的 Transformer，和现在跑的大模型，已经不是同一艘船</text>

  <!-- 列 1 -->
  <g>
    <rect x="40" y="86" width="176" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="128" y="112" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">位置编码</text>
    <text x="128" y="136" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">原装</text>
    <rect x="58" y="144" width="140" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="128" y="163" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#64748B">正弦固定值</text>
    <line x1="128" y1="178" x2="128" y2="200" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#a4)"/>
    <text x="128" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">现在</text>
    <rect x="58" y="228" width="140" height="30" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="128" y="247" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#4338CA">旋转位置编码 RoPE</text>
    <text x="58" y="278" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">长上下文扩展</text>
    <text x="58" y="298" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">以及不用位置编码的</text>
    <text x="58" y="318" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">NoPE 方案</text>
    <text x="58" y="350" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">这条线基本收束了</text>
  </g>

  <!-- 列 2 -->
  <g>
    <rect x="228" y="86" width="176" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="316" y="112" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">归一化</text>
    <text x="316" y="136" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">原装</text>
    <rect x="246" y="144" width="140" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="316" y="163" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#64748B">LayerNorm</text>
    <line x1="316" y1="178" x2="316" y2="200" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#a4)"/>
    <text x="316" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">现在</text>
    <rect x="246" y="228" width="140" height="30" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="316" y="247" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#4338CA">RMSNorm</text>
    <text x="246" y="278" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">位置可放在注意力</text>
    <text x="246" y="298" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">之前、之后、前后</text>
    <text x="246" y="318" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">还能作用到 Q、K、V</text>
    <text x="246" y="350" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">排列组合被穷举</text>
  </g>

  <!-- 列 3 -->
  <g>
    <rect x="416" y="86" width="176" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="504" y="112" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">残差连接</text>
    <text x="504" y="136" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">原装</text>
    <rect x="434" y="144" width="140" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="504" y="163" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#64748B">输入直接加到输出</text>
    <line x1="504" y1="178" x2="504" y2="200" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#a4)"/>
    <text x="504" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">现在</text>
    <rect x="434" y="228" width="140" height="30" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="504" y="247" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#B45309">开始有人动刀子</text>
    <text x="434" y="278" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">多年没人碰的加法，</text>
    <text x="434" y="298" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">近两年出现改造尝试</text>
    <text x="434" y="318" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">玩法还很有限</text>
    <text x="434" y="350" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">仍在探索阶段</text>
  </g>

  <!-- 列 4 -->
  <g>
    <rect x="604" y="86" width="176" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="692" y="112" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">FFN</text>
    <text x="692" y="136" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">原装</text>
    <rect x="622" y="144" width="140" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="692" y="163" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#64748B">一个大的全连接</text>
    <line x1="692" y1="178" x2="692" y2="200" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#a4)"/>
    <text x="692" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">现在</text>
    <rect x="622" y="228" width="140" height="30" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="692" y="247" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#047857">MoE 混合专家</text>
    <text x="622" y="278" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">拆成多个小专家</text>
    <text x="622" y="298" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">加一个路由层，每个</text>
    <text x="622" y="318" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">token 只走其中一个</text>
    <text x="622" y="350" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">模型名里的 A3B 源自这里</text>
  </g>

  <!-- 列 5 -->
  <g>
    <rect x="792" y="86" width="168" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="876" y="112" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">注意力</text>
    <text x="876" y="136" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">原装</text>
    <rect x="810" y="144" width="132" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="876" y="163" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#64748B">多头注意力 MHA</text>
    <line x1="876" y1="178" x2="876" y2="200" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#a4)"/>
    <text x="876" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94A3B8">现在</text>
    <rect x="810" y="228" width="132" height="30" rx="6" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="876" y="247" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#B91C1C">最卷的一块</text>
    <text x="810" y="278" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">MQA / GQA / MLA</text>
    <text x="810" y="298" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">稀疏、线性、Mamba</text>
    <text x="810" y="318" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#475569">以及混合注意力</text>
    <text x="810" y="350" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">谁更好还没定论</text>
  </g>

  <text x="40" y="416" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#64748B">换完之后，模型之间的差距在缩小，能靠改架构拿到的性能越来越少了。</text>
</svg>
