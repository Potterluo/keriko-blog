<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="日志的每一行背后是一层">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#F8FAFC"/>

  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">一行日志，一层东西</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">左边是跑出来的样子，右边是让它成立的那一层；抽掉任何一层，这一行就不成立</text>

  <!-- 行 1 -->
  <rect x="40" y="88" width="300" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="112" font-family="Consolas,monospace" font-size="10.5" fill="#E2E8F0">[tool] run_shell: FF</text>
  <text x="58" y="132" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="9.5" fill="#94A3B8">两个用例失败，说明命令跑对了地方</text>
  <line x1="344" y1="117" x2="392" y2="117" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="88" width="560" height="58" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="418" y="110" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4338CA">① 现场　workspace.py</text>
  <text x="418" y="130" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">仓库根、分支、改动、项目文档；不是 git 仓库就降级</text>

  <!-- 行 2 -->
  <rect x="40" y="156" width="300" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="180" font-family="Consolas,monospace" font-size="10.5" fill="#E2E8F0">[tool] read_file: def add(a, b)</text>
  <text x="58" y="200" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="9.5" fill="#94A3B8">它读得到文件，也用得起读到的内容</text>
  <line x1="344" y1="185" x2="392" y2="185" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="156" width="560" height="58" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="418" y="178" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#047857">② 工具与闸门　tools.py</text>
  <text x="418" y="198" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">六个固定工具；参数、路径、权限五道检查，失败返回可读原因</text>

  <!-- 行 3 -->
  <rect x="40" y="224" width="300" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="248" font-family="Consolas,monospace" font-size="10.5" fill="#E2E8F0">[review] patch_file -&gt; approved</text>
  <text x="58" y="268" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="9.5" fill="#94A3B8">改文件之前有人点头</text>
  <line x1="344" y1="253" x2="392" y2="253" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="224" width="560" height="58" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="418" y="246" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#B45309">③ 三道闸　roles.py · service.py</text>
  <text x="418" y="266" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">代码校验 → 人工批准 → 模型审核，审核用的是独立组织的上下文</text>

  <!-- 行 4 -->
  <rect x="40" y="292" width="300" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="316" font-family="Consolas,monospace" font-size="10.5" fill="#E2E8F0">[assistant] 两个 bug 都清楚…</text>
  <text x="58" y="336" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="9.5" fill="#94A3B8">读了两次还能抓住重点</text>
  <line x1="344" y1="321" x2="392" y2="321" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="292" width="560" height="58" rx="8" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="418" y="314" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#0369A1">④ 上下文削减　context.py</text>
  <text x="418" y="334" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">单块封顶 4000 字；最近六条工具结果保真，更早的压到 400 字</text>

  <!-- 行 5 -->
  <rect x="40" y="360" width="300" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="384" font-family="Consolas,monospace" font-size="10.5" fill="#E2E8F0">--resume latest</text>
  <text x="58" y="404" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="9.5" fill="#94A3B8">关掉再打开，接着上次干</text>
  <line x1="344" y1="389" x2="392" y2="389" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="360" width="560" height="58" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="418" y="382" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#5B21B6">⑤ 记忆与续跑　session.py</text>
  <text x="418" y="402" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">每步落盘；完整转录 + 工作记忆（任务、在动的文件、笔记）</text>

  <!-- 行 6 -->
  <rect x="40" y="428" width="300" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="452" font-family="Consolas,monospace" font-size="10.5" fill="#E2E8F0">delegate_result: …</text>
  <text x="58" y="472" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="9.5" fill="#94A3B8">支线查完只回结论</text>
  <line x1="344" y1="457" x2="392" y2="457" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="428" width="560" height="58" rx="8" fill="#FDF2F8" stroke="#F9A8D4"/>
  <text x="418" y="450" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#9D174D">⑥ 有界委派　runtime.py</text>
  <text x="418" y="470" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">只读、三步、深度到顶就不再注册 delegate，递归从结构上掐断</text>

  <!-- 行 7 -->
  <rect x="40" y="496" width="300" height="46" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="524" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">日志里看不见的那一层</text>
  <line x1="344" y1="519" x2="392" y2="519" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#m1)"/>
  <rect x="400" y="496" width="560" height="46" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="418" y="516" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#334155">⑦ 接口与装配根　ports.py · runtime.py</text>
  <text x="418" y="533" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#475569">换模型只改一个文件；测试换成假客户端，0.4 秒跑完</text>
</svg>
