<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="六项要求与代码落点">
  <defs>
    <marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#F8FAFC"/>

  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">六项要求，六个落点</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">每一项都配一个失败模式，失败模式直接变成测试用例</text>

  <text x="60" y="94" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">要求</text>
  <text x="500" y="94" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">落点与验收</text>

  <!-- 行 1 -->
  <rect x="40" y="102" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="58" y="124" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">① 上下文忠实</text>
  <text x="58" y="145" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">仓库、分支、改动、项目约定，启动时一次收齐</text>
  <line x1="444" y1="132" x2="478" y2="132" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#k1)"/>
  <rect x="484" y="102" width="476" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="502" y="124" font-family="system-ui,sans-serif" font-size="11" fill="#0F172A">workspace.py</text>
  <text x="502" y="145" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">不是 git 仓库时优雅降级，不报错</text>

  <!-- 行 2 -->
  <rect x="40" y="170" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="58" y="192" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">② 成本可控</text>
  <text x="58" y="213" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">不变的在前，多变的在后，让前缀缓存反复命中</text>
  <line x1="444" y1="200" x2="478" y2="200" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#k1)"/>
  <rect x="484" y="170" width="476" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="502" y="192" font-family="system-ui,sans-serif" font-size="11" fill="#0F172A">runtime.py · client.py</text>
  <text x="502" y="213" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">系统提示只构造一次，之后只追加消息</text>

  <!-- 行 3 -->
  <rect x="40" y="238" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="58" y="260" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">③ 动作可控</text>
  <text x="58" y="281" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">固定工具、参数校验、越界拦截、危险操作批准</text>
  <line x1="444" y1="268" x2="478" y2="268" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#k1)"/>
  <rect x="484" y="238" width="476" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="502" y="260" font-family="system-ui,sans-serif" font-size="11" fill="#0F172A">tools.py</text>
  <text x="502" y="281" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">五道闸；失败一律返回 error: 字符串</text>

  <!-- 行 4 -->
  <rect x="40" y="306" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="58" y="328" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">④ 窗口不炸</text>
  <text x="58" y="349" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">单块封顶、老的压缩、近的保真</text>
  <line x1="444" y1="336" x2="478" y2="336" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#k1)"/>
  <rect x="484" y="306" width="476" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="502" y="328" font-family="system-ui,sans-serif" font-size="11" fill="#0F172A">context.py</text>
  <text x="502" y="349" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">4000 字封顶；只压最近六条之外的旧结果</text>

  <!-- 行 5 -->
  <rect x="40" y="374" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="58" y="396" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">⑤ 会话可续</text>
  <text x="58" y="417" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">完整转录落盘，另有一份工作记忆</text>
  <line x1="444" y1="404" x2="478" y2="404" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#k1)"/>
  <rect x="484" y="374" width="476" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="502" y="396" font-family="system-ui,sans-serif" font-size="11" fill="#0F172A">session.py</text>
  <text x="502" y="417" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">临时文件 + os.replace，关掉进程还能续</text>

  <!-- 行 6 -->
  <rect x="40" y="442" width="400" height="60" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="58" y="464" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">⑥ 支线隔离</text>
  <text x="58" y="485" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">派出去只收回结论，不许无限往下派</text>
  <line x1="444" y1="472" x2="478" y2="472" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#k1)"/>
  <rect x="484" y="442" width="476" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="502" y="464" font-family="system-ui,sans-serif" font-size="11" fill="#0F172A">runtime.py · delegate</text>
  <text x="502" y="485" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">只读 + 三步 + depth 到顶就不再注册</text>
</svg>
