<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Agent 的最小循环">
  <defs>
    <marker id="l1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="l2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366F1"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#F8FAFC"/>

  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">Agent 的最小循环</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">几十行就能写完；让它能用的东西全在循环外面</text>

  <!-- 用户消息 -->
  <rect x="60" y="96" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="80" y="120" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#0369A1">用户消息</text>
  <text x="80" y="140" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">「跑一下测试，把失败的修好」</text>

  <line x1="368" y1="124" x2="428" y2="124" stroke="#64748B" stroke-width="1.5" marker-end="url(#l1)"/>

  <!-- 模型决策 -->
  <rect x="436" y="96" width="270" height="56" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="456" y="120" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">模型决策</text>
  <text x="456" y="140" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">读现场 + 历史 + 工具说明，产出一段文本</text>

  <!-- 判断 -->
  <line x1="714" y1="124" x2="762" y2="124" stroke="#64748B" stroke-width="1.5" marker-end="url(#l1)"/>
  <rect x="770" y="102" width="170" height="44" rx="22" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="855" y="129" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#334155">要调工具吗</text>

  <!-- 是：执行 -->
  <path d="M855 148 L855 196" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#l1)"/>
  <text x="864" y="176" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">是</text>
  <rect x="700" y="202" width="280" height="58" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="720" y="226" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#047857">执行动作</text>
  <text x="720" y="246" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">过闸，跑工具，结果按 call id 回填</text>

  <!-- 回路 -->
  <path d="M700 231 L560 231 L560 158" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#l2)"/>
  <text x="470" y="238" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#6366F1">把结果塞回历史，再决策</text>

  <!-- 否：结束 -->
  <path d="M855 284 L855 318" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#l1)"/>
  <rect x="700" y="324" width="280" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="720" y="348" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#334155">返回纯文本</text>
  <text x="720" y="368" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">循环结束，或者撞上步数上限</text>

  <!-- 左侧说明 -->
  <rect x="60" y="196" width="590" height="184" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="80" y="220" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#0F172A">循环外面那层壳要做的事</text>
  <text x="80" y="246" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">决定它看到什么：仓库现场、历史消息、工具说明</text>
  <text x="80" y="270" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">决定它能做什么：六个受限动作，参数有 schema</text>
  <text x="80" y="294" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">决定后果怎么处理：过闸、执行、裁剪、回填、审核</text>
  <text x="80" y="318" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">决定状态存哪：每步落盘，断了能续</text>
  <text x="80" y="348" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">这也是 harness 要解决的问题范围</text>
</svg>
