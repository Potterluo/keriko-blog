<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="六堵墙与六种能力">
  <defs>
    <marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F43F5E"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#F8FAFC"/>
  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">裸循环撞上的六堵墙，每堵对应一种能力</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">左边是场景里一步一步撞出来的，右边是解法和它落在哪个文件</text>
  <text x="60" y="96" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">撞上的墙</text>
  <text x="520" y="96" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#94A3B8">对应的能力</text>  <rect x="40" y="106" width="410" height="60" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="58" y="128" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#BE123C">① 不知道自己在哪</text>
  <text x="58" y="149" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">凭文件名猜结构，第一条命令跑错目录</text>
  <line x1="454" y1="136" x2="494" y2="136" stroke="#F43F5E" stroke-width="1.3" marker-end="url(#w1)"/>
  <rect x="500" y="106" width="460" height="60" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="518" y="128" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">现场注入</text>
  <text x="518" y="149" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">会话前收仓库根、分支、改动、项目文档　workspace.py</text>  <rect x="40" y="174" width="410" height="60" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="58" y="196" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#BE123C">② 动不了手</text>
  <text x="58" y="217" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">只会说「改成 a + b」，改文件靠人复制粘贴</text>
  <line x1="454" y1="204" x2="494" y2="204" stroke="#F43F5E" stroke-width="1.3" marker-end="url(#w1)"/>
  <rect x="500" y="174" width="460" height="60" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="518" y="196" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">固定工具集</text>
  <text x="518" y="217" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">六个受限动作，参数带 schema　tools.py</text>  <rect x="40" y="242" width="410" height="60" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="58" y="264" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#BE123C">③ 拦不住</text>
  <text x="58" y="285" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">接上 shell 后，可能删测试来「让测试通过」</text>
  <line x1="454" y1="272" x2="494" y2="272" stroke="#F43F5E" stroke-width="1.3" marker-end="url(#w1)"/>
  <rect x="500" y="242" width="460" height="60" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="518" y="264" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">分级授权</text>
  <text x="518" y="285" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">代码校验、人工批准、模型审核　tools.py + roles.py</text>  <rect x="40" y="310" width="410" height="60" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="58" y="332" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#BE123C">④ 看不全</text>
  <text x="58" y="353" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">每次输出都塞回上下文，十几步撑满，模型「变笨」</text>
  <line x1="454" y1="340" x2="494" y2="340" stroke="#F43F5E" stroke-width="1.3" marker-end="url(#w1)"/>
  <rect x="500" y="310" width="460" height="60" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="518" y="332" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">上下文管理</text>
  <text x="518" y="353" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">单块封顶、老结果压缩、近期保真　context.py</text>  <rect x="40" y="378" width="410" height="60" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="58" y="400" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#BE123C">⑤ 记不住</text>
  <text x="58" y="421" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">进程一断，前面几十步全白干</text>
  <line x1="454" y1="408" x2="494" y2="408" stroke="#F43F5E" stroke-width="1.3" marker-end="url(#w1)"/>
  <rect x="500" y="378" width="460" height="60" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="518" y="400" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">状态持久化</text>
  <text x="518" y="421" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">每步落盘，转录加工作记忆　session.py</text>  <rect x="40" y="446" width="410" height="60" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="58" y="468" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#BE123C">⑥ 会跑偏</text>
  <text x="58" y="489" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">支线调查挤进主对话，主线被搅浑</text>
  <line x1="454" y1="476" x2="494" y2="476" stroke="#F43F5E" stroke-width="1.3" marker-end="url(#w1)"/>
  <rect x="500" y="446" width="460" height="60" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="518" y="468" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#4338CA">委派隔离</text>
  <text x="518" y="489" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">子 agent 只读、步数封顶、不能再派　runtime.py</text></svg>
