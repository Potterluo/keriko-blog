<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="三层与四个抽象">
  <defs>
    <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#F8FAFC"/>

  <text x="40" y="40" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0F172A">三层与四个抽象</text>
  <text x="40" y="64" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#64748B">层是被约束切出来的，层里的抽象各回答循环里的一个问题</text>

  <rect x="60" y="86" width="880" height="52" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="80" y="108" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#B45309">装配根 · runtime.py</text>
  <text x="80" y="127" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#92400E">唯一 import 适配层的地方；换模型、换存储、换前端入口都只改这里</text>

  <rect x="60" y="150" width="880" height="96" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="80" y="174" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0369A1">应用层</text>
  <text x="80" y="192" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#64748B">只 import 领域层，通过接口调用外部能力</text>
  <rect x="80" y="202" width="170" height="32" rx="8" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="165" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#0369A1">service（循环）</text>
  <rect x="262" y="202" width="170" height="32" rx="8" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="347" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#0369A1">roles（两个角色）</text>
  <rect x="444" y="202" width="160" height="32" rx="8" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="524" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#0369A1">context（削减）</text>
  <rect x="616" y="202" width="304" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="768" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">ports：SessionStore / ModelClient / Approver</text>

  <rect x="60" y="258" width="880" height="96" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="80" y="282" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#047857">适配层</text>
  <text x="80" y="300" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#64748B">把外部世界翻译成领域对象，并实现应用层的接口</text>
  <rect x="80" y="310" width="200" height="32" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="180" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#047857">tools（工具与闸门）</text>
  <rect x="292" y="310" width="200" height="32" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="392" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#047857">workspace（现场）</text>
  <rect x="504" y="310" width="200" height="32" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="604" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#047857">client（模型协议）</text>
  <rect x="716" y="310" width="204" height="32" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="818" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#047857">session（存储）</text>

  <line x1="300" y1="140" x2="300" y2="148" stroke="#64748B" stroke-width="1.4" marker-end="url(#q1)"/>
  <line x1="300" y1="248" x2="300" y2="256" stroke="#64748B" stroke-width="1.4" marker-end="url(#q1)"/>
  <line x1="300" y1="356" x2="300" y2="366" stroke="#6366F1" stroke-width="1.4" marker-end="url(#q1)"/>
  <text x="310" y="364" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#6366F1">使用</text>

  <rect x="60" y="370" width="880" height="222" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="80" y="394" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#4338CA">领域层 · 四个抽象</text>
  <text x="80" y="412" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#6366F1">换任何外部服务，这一行都不用改</text>

  <rect x="80" y="424" width="410" height="74" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="98" y="446" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4338CA">Session · 三种消息 · ToolCall</text>
  <text x="98" y="466" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">回答「对话是什么」：id + 消息列表 + 工作记忆</text>
  <text x="98" y="486" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">ToolCall.id 是把动作和结果对上的唯一凭据</text>

  <rect x="510" y="424" width="410" height="74" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="528" y="446" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4338CA">Tool</text>
  <text x="528" y="466" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">回答「动作是什么」：name / description / parameters / risky / invoke</text>
  <text x="528" y="486" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">risky 在这层，因为危险是工具的属性，不是调用的属性</text>

  <rect x="80" y="510" width="410" height="74" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="98" y="532" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4338CA">Context&lt;OpType&gt;</text>
  <text x="98" y="552" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">回答「模型看到什么」：instruction + tools + history + 输出类型</text>
  <text x="98" y="572" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">泛型让回复和审核共用同一套组装逻辑</text>

  <rect x="510" y="510" width="410" height="74" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="528" y="532" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4338CA">Decision(approved, reason)</text>
  <text x="528" y="552" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#475569">回答「一次动作谁说了算」：能不能执行、为什么</text>
  <text x="528" y="572" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="10" fill="#94A3B8">拒绝必须带原因，原因会交还模型让它换策略</text>
</svg>